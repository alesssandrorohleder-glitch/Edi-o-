<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas><script>
const W=1080,H=1920,c=document.getElementById('c');let x=c.getContext('2d');const X0=x;
const DISP='"Inter Display",Inter,sans-serif',SANS='Inter,sans-serif',GEO='"TeX Gyre Adventor",sans-serif';
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),p=(t,a,b)=>cl((t-a)/(b-a));
const eo=t=>1-Math.pow(1-t,3),eo5=t=>1-Math.pow(1-t,5),eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,sine=t=>-(Math.cos(Math.PI*t)-1)/2;
const back=t=>{if(t<=0)return 0;const c1=1.8,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const elastic=t=>{if(t<=0)return 0;if(t>=1)return 1;return Math.pow(2,-10*t)*Math.sin((t*10-.75)*2*Math.PI/3)+1};
const bounce=t=>{const n1=7.5625,d1=2.75;if(t<1/d1)return n1*t*t;else if(t<2/d1)return n1*(t-=1.5/d1)*t+.75;else if(t<2.5/d1)return n1*(t-=2.25/d1)*t+.9375;return n1*(t-=2.625/d1)*t+.984375;};
const rnd=s=>{const r=Math.sin(s*127.1+311.7)*43758.5453;return r-Math.floor(r)};const lerp=(a,b,k)=>a+(b-a)*k;
function T(s,X,Y,size,col,{font=DISP,w=600,align='center',a=1,ls=0,blur=0}={}){x.save();x.globalAlpha*=a;if(blur>.3)x.filter=`blur(${blur}px)`;x.fillStyle=col;x.font=`${w} ${size}px ${font}`;x.textAlign=align;x.textBaseline='middle';x.letterSpacing=ls+'px';x.fillText(s,X,Y);x.restore();}
function maskUp(s,X,Y,size,col,t,t0,o={}){const k=eo5(p(t,t0,t0+.5));if(k<=0)return;x.save();x.beginPath();x.rect(0,Y-size*.8,W,size*1.6);x.clip();T(s,X,Y+(1-k)*size*1.1,size,col,o);x.restore();}
function fade(s,X,Y,size,col,t,t0,o={}){const k=eo(p(t,t0,t0+.6));if(k<=0)return;T(s,X,Y+(1-k)*14,size,col,{...o,a:k*(o.a??1)});}
function pathProgress(pts,k,closed=false){const P=closed?pts.concat([pts[0]]):pts;let L=0;const seg=[];for(let i=1;i<P.length;i++){const l=Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]);seg.push(l);L+=l;}
  let left=L*cl(k);x.beginPath();x.moveTo(P[0][0],P[0][1]);for(let i=1;i<P.length;i++){if(left<=0)break;const f=Math.min(1,left/seg[i-1]);x.lineTo(lerp(P[i-1][0],P[i][0],f),lerp(P[i-1][1],P[i][1],f));left-=seg[i-1];}}

/* ---------- INTRO 0-4 ---------- */
function intro(t){x.fillStyle='#FFFFFF';x.fillRect(0,0,W,H);
  const words=[['Sua marca',0.1,'#16181C'],['merece',0.6,'#16181C'],['ganhar',1.1,'#FF5A3C'],['vida.',1.6,'#FF5A3C']];
  const out=eio(p(t,3.2,3.7));x.save();x.translate(0,-out*120);x.globalAlpha=1-out;
  words.forEach(([s,t0,col],i)=>maskUp(s,W/2,700+i*150,140,col,t,t0,{w:700}));x.restore();
  // little bouncing dot as "life"
  const d=p(t,2.0,3.2);if(d>0&&d<1){const by=1340-Math.abs(Math.sin(d*Math.PI*3))*160*(1-d);x.fillStyle='#FF5A3C';x.beginPath();x.arc(W/2,by,22,0,7);x.fill();}
}
/* ---------- R1 BLOOM ---------- */
const PET=['#FF7A59','#FF9EC4','#FFC857','#7ED7C1','#B9A3FF'];
function bloomMark(cx,cy,s,t){ // t: 0.. assembled at >=1
  const R=90*s;for(let i=0;i<5;i++){const a=-Math.PI/2+i*2*Math.PI/5;const px=cx+Math.cos(a)*R,py=cy+Math.sin(a)*R;x.save();x.translate(px,py);x.rotate(a+Math.PI/2);x.fillStyle=PET[i];x.globalAlpha=.92;x.beginPath();x.ellipse(0,0,62*s,98*s,0,0,7);x.fill();x.restore();}
  x.fillStyle='#3B2F3F';x.beginPath();x.arc(cx,cy,34*s*t,0,7);x.fill();}
function r1(t){x.fillStyle='#FFF3EC';x.fillRect(0,0,W,H);
  const cx=W/2,cy=860;
  const toRing=eio(p(t,1.3,2.1)),toPet=eio(p(t,2.1,2.7)),up=eio(p(t,3.4,4.0));const markY=lerp(cy,760,up),ms=lerp(1.25,1.0,up);
  for(let i=0;i<5;i++){const fall=bounce(p(t,.05+i*.12,1.05+i*.12));if(fall<=0)continue;
    const rx=cx+(i-2)*170,ry=lerp(-200,cy+120,fall);
    const a=-Math.PI/2+i*2*Math.PI/5;const R=90*ms;const tx=cx+Math.cos(a)*R,ty=markY+Math.sin(a)*R;
    const px=lerp(rx,tx,toRing),py=lerp(ry,ty,toRing);
    const ew=lerp(70,62*ms,toPet),eh=lerp(70,98*ms,toPet);const sq=(t>.05+i*.12+.36&&t<.05+i*.12+.6)?1.15:1;
    x.save();x.translate(px,py);x.rotate((a+Math.PI/2)*toPet);x.fillStyle=PET[i];x.globalAlpha=lerp(1,.92,toPet);x.beginPath();x.ellipse(0,0,ew*sq,eh/sq,0,0,7);x.fill();x.restore();}
  const dot=elastic(p(t,2.7,3.5));if(dot>0){x.fillStyle='#3B2F3F';x.beginPath();x.arc(cx,markY,34*ms*dot,0,7);x.fill();}
  maskUp('bloom',W/2,1080,170,'#3B2F3F',t,3.6,{w:600,ls:-4});
  fade('ESTÚDIO FLORAL',W/2,1210,40,'#9A7F8F',t,4.2,{font:SANS,w:500,ls:10});
}
/* ---------- R2 ATLAS ---------- */
function r2(t){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#13233A');g.addColorStop(1,'#0A1322');x.fillStyle=g;x.fillRect(0,0,W,H);
  const cx=W/2,cy=820,S=1.25;const outer=[[cx-200*S,cy+150*S],[cx,cy-190*S],[cx+200*S,cy+150*S]];const inner=[[cx-90*S,cy+150*S],[cx+30*S,cy-30*S],[cx+130*S,cy+150*S]];
  x.save();x.strokeStyle='#D9B56A';x.lineWidth=7;x.lineJoin='round';x.lineCap='round';
  pathProgress(outer.concat([[cx-200*S,cy+150*S]]),eio(p(t,.2,1.6)));x.stroke();
  pathProgress(inner,eio(p(t,.9,1.9)));x.stroke();
  pathProgress([[cx-280*S,cy+150*S],[cx+280*S,cy+150*S]],eio(p(t,1.3,2.0)));x.stroke();x.restore();
  const fk=eo(p(t,2.0,2.6));if(fk>0){x.save();x.globalAlpha=fk;const gg=x.createLinearGradient(cx-200,cy-190,cx+200,cy+150);gg.addColorStop(0,'#F5DEA0');gg.addColorStop(.5,'#D9B56A');gg.addColorStop(1,'#9C7A35');x.fillStyle=gg;
    x.beginPath();x.moveTo(...outer[0]);x.lineTo(...outer[1]);x.lineTo(...outer[2]);x.closePath();x.fill();x.fillStyle='#0F1C30';x.beginPath();x.moveTo(...inner[0]);x.lineTo(...inner[1]);x.lineTo(...inner[2]);x.closePath();x.fill();
    const sw=p(t,2.6,3.4);if(sw>0&&sw<1){x.globalCompositeOperation='source-atop';const sx=lerp(cx-400,cx+400,sine(sw));const lg=x.createLinearGradient(sx-80,0,sx+80,0);lg.addColorStop(0,'rgba(255,255,255,0)');lg.addColorStop(.5,'rgba(255,255,255,.8)');lg.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=lg;x.fillRect(cx-400,cy-300,800,600);}
    x.restore();}
  // sparkle at apex
  const sp=p(t,1.5,2.1);if(sp>0&&sp<1){const a=Math.sin(sp*Math.PI);x.save();x.translate(cx,cy-190*S);x.rotate(sp*2);x.fillStyle=`rgba(255,240,200,${a})`;x.beginPath();for(let q=0;q<8;q++){const r=q%2?6:60*a;x.lineTo(Math.cos(q*Math.PI/4)*r,Math.sin(q*Math.PI/4)*r);}x.fill();x.restore();}
  const k=sine(p(t,3.0,4.0));if(k>0)T('ATLAS',W/2,1150,130,'#F4EDE0',{font:GEO,w:400,ls:lerp(90,36,k),a:k});
  fade('CAPITAL  &  INVESTIMENTOS',W/2,1270,40,'#D9B56A',t,4.0,{font:SANS,w:400,ls:8});
}
/* ---------- R3 VOLT ---------- */
const BOLT=[[40,-260],[-110,30],[-10,30],[-60,260],[120,-60],[15,-60],[90,-260]];
function boltPath(cx,cy,s){x.beginPath();BOLT.forEach(([a,b],i)=>{i?x.lineTo(cx+a*s,cy+b*s):x.moveTo(cx+a*s,cy+b*s);});x.closePath();}
function r3(t){x.fillStyle='#08090A';x.fillRect(0,0,W,H);
  const cx=W/2,cy=800,S=1.1;
  x.save();const sh=p(t,1.0,1.35)>0&&t<1.35?Math.sin(t*120)*14*(1.35-t)/.35:0;x.translate(sh,0);
  // flicker draw
  const dk=p(t,.3,.9);if(dk>0){x.save();x.strokeStyle='#C6FF3D';x.lineWidth=8;x.lineJoin='round';x.shadowColor='#C6FF3D';x.shadowBlur=40;
    const fl=t<1.0?(rnd(Math.floor(t*30))>.3?1:.25):1;x.globalAlpha=fl;pathProgress(BOLT.map(([a,b])=>[cx+a*S,cy+b*S]),eio(dk),true);x.stroke();x.restore();}
  const fk=eo(p(t,1.0,1.2));if(fk>0){x.save();x.shadowColor='#C6FF3D';x.shadowBlur=60;x.fillStyle='#C6FF3D';x.globalAlpha=fk;boltPath(cx,cy,S);x.fill();x.restore();}
  // electric arcs
  if(t>.4&&t<1.6){x.save();x.strokeStyle='rgba(220,255,140,.8)';x.lineWidth=3;x.shadowColor='#C6FF3D';x.shadowBlur=20;for(let k=0;k<3;k++){const a0=rnd(Math.floor(t*20)+k)*7;x.beginPath();let px=cx,py=cy;x.moveTo(px,py);for(let j=0;j<6;j++){px+=Math.cos(a0)*50+(rnd(j+k*9+Math.floor(t*20))-.5)*60;py+=Math.sin(a0)*50+(rnd(j*3+k)-.5)*60;x.lineTo(px,py);}x.stroke();}x.restore();}
  x.restore();
  // flash + shockwave
  const f=p(t,1.0,1.25);if(f>0&&f<1){x.fillStyle=`rgba(230,255,180,${.8*(1-f)})`;x.fillRect(0,0,W,H);}
  const sw=p(t,1.0,1.8);if(sw>0&&sw<1){x.strokeStyle=`rgba(198,255,61,${1-sw})`;x.lineWidth=10*(1-sw)+2;x.beginPath();x.arc(cx,cy,100+sw*700,0,7);x.stroke();}
  // sparks
  for(let i=0;i<50;i++){const tt=t-1.0;if(tt<0||tt>1.6)break;const a=rnd(i)*7,v=300+rnd(i*3)*600;const px=cx+Math.cos(a)*v*eo(tt/1.6),py=cy+Math.sin(a)*v*eo(tt/1.6)+tt*tt*200;x.fillStyle=`rgba(220,255,150,${1-tt/1.6})`;x.fillRect(px,py,4,4);}
  // wordmark slam with RGB split
  const k=p(t,1.6,1.85);if(k>0){const sc=1+(1-eo5(k))*.8;const g=Math.max(0,1-(t-1.6)/.4)*14;x.save();x.translate(W/2,1180);x.scale(sc,sc);
    if(g>0){x.globalCompositeOperation='lighter';T('volt',-g,0,230,'#FF2E63',{w:800,ls:-6,a:.8});T('volt',g,0,230,'#2EF0FF',{w:800,ls:-6,a:.8});x.globalCompositeOperation='source-over';}
    T('volt',0,0,230,'#F2FFE0',{w:800,ls:-6,a:cl(k*2)});x.restore();}
  fade('ENERGIA EM MOVIMENTO',W/2,1330,40,'#C6FF3D',t,3.2,{font:SANS,w:600,ls:10});
}
/* ---------- R4 ORBITA ---------- */
function r4(t){const g=x.createRadialGradient(W/2,820,50,W/2,900,1300);g.addColorStop(0,'#3B1F73');g.addColorStop(1,'#0E0822');x.fillStyle=g;x.fillRect(0,0,W,H);
  const cx=W/2,cy=820,R=190;const conv=eio(p(t,0,2.4));
  for(let i=0;i<520;i++){const a0=rnd(i)*7,r0=300+rnd(i*7)*900;const ta=i/520*Math.PI*2;
    const sw=(1-conv)*4;const a=lerp(a0,ta,conv)+sw;const r=lerp(r0,R,conv);const px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r*lerp(1,1,conv);
    x.fillStyle=`rgba(${200+rnd(i*3)*55|0},${180+rnd(i*5)*60|0},255,${.4+.6*conv})`;const s=lerp(2+rnd(i*9)*3,3.4,conv);x.fillRect(px-s/2,py-s/2,s,s);}
  const ring=eio(p(t,2.2,2.8));if(ring>0){x.save();x.strokeStyle='#EDE6FF';x.lineWidth=14;x.shadowColor='#A98BFF';x.shadowBlur=40;x.beginPath();x.arc(cx,cy,R,-Math.PI/2,-Math.PI/2+Math.PI*2*ring);x.stroke();x.restore();}
  const pk=elastic(p(t,2.6,3.4));if(pk>0){const oa=(t-2.6)*2.4-Math.PI/4;x.save();x.shadowColor='#FFB86B';x.shadowBlur=40;x.fillStyle='#FFB86B';x.beginPath();x.arc(cx+Math.cos(oa)*R,cy+Math.sin(oa)*R,34*pk,0,7);x.fill();x.restore();
    x.fillStyle='#EDE6FF';x.beginPath();x.arc(cx,cy,60*pk,0,7);x.fill();}
  const k=sine(p(t,3.0,4.0));if(k>0)T('órbita',W/2,1170,160,'#F3EEFF',{w:500,ls:2,a:k,blur:(1-k)*12});
  fade('TECNOLOGIA  ·  ESPAÇO  ·  DADOS',W/2,1290,40,'#B9A3FF',t,3.8,{font:SANS,w:500,ls:6});
}
/* ---------- CTA 28-34 ---------- */
function cta(t){x.fillStyle='#16181C';x.fillRect(0,0,W,H);
  // recap minis
  const minis=[(X,Y)=>bloomMark(X,Y,.42,1),(X,Y)=>{x.save();x.fillStyle='#D9B56A';x.beginPath();x.moveTo(X-80,Y+60);x.lineTo(X,Y-76);x.lineTo(X+80,Y+60);x.closePath();x.fill();x.fillStyle='#16181C';x.beginPath();x.moveTo(X-36,Y+60);x.lineTo(X+12,Y-12);x.lineTo(X+52,Y+60);x.closePath();x.fill();x.restore();},
    (X,Y)=>{x.save();x.shadowColor='#C6FF3D';x.shadowBlur=20;x.fillStyle='#C6FF3D';boltPath(X,Y,.4);x.fill();x.restore();},
    (X,Y)=>{x.save();x.strokeStyle='#EDE6FF';x.lineWidth=7;x.beginPath();x.arc(X,Y,64,0,7);x.stroke();x.fillStyle='#FFB86B';x.beginPath();x.arc(X+45,Y-45,16,0,7);x.fill();x.fillStyle='#EDE6FF';x.beginPath();x.arc(X,Y,22,0,7);x.fill();x.restore();}];
  minis.forEach((f,i)=>{const k=back(p(t,.1+i*.12,.5+i*.12));if(k<=0)return;const X=165+i*250,Y=430;x.save();x.translate(X,Y);x.scale(k,k);x.translate(-X,-Y);x.fillStyle='rgba(255,255,255,.06)';x.beginPath();x.roundRect(X-105,Y-105,210,210,40);x.fill();f(X,Y);x.restore();});
  fade('Esses logos não existem.',W/2,700,46,'rgba(255,255,255,.6)',t,.6,{font:SANS,w:400});
  maskUp('Mas o seu pode',W/2,830,84,'#FFFFFF',t,1.0,{w:700});
  maskUp('ganhar vida assim.',W/2,935,84,'#FF5A3C',t,1.2,{w:700});
  ['Logo animado','Vinheta de abertura','Intro para Reels'].forEach((s,i)=>{const k=eo(p(t,1.8+i*.2,2.3+i*.2));if(k<=0)return;x.save();x.globalAlpha=k;x.fillStyle='#FF5A3C';x.beginPath();x.arc(320,1070+i*80,9,0,7);x.fill();T(s,350,1070+i*80,44,'#FFFFFF',{font:SANS,w:500,align:'left'});x.restore();});
  const bk=back(p(t,2.8,3.3));const pul=1+.03*Math.exp(-((t%.5))*8)*(t>3.3?1:0);if(bk>0){x.save();x.translate(W/2,1370);x.scale(bk*pul,bk*pul);x.fillStyle='#FF5A3C';x.beginPath();x.roundRect(-330,-75,660,150,75);x.fill();T('Me chama no direct',0,3,50,'#FFFFFF',{font:SANS,w:700});x.restore();}
  fade('@alecreator_motion',W/2,1510,56,'#FFFFFF',t,3.3,{font:SANS,w:600});
}
const SC=[[intro,0,4,'#FFFFFF'],[r1,4,10,'#FF7A59'],[r2,10,16,'#D9B56A'],[r3,16,22,'#C6FF3D'],[r4,22,28,'#7B5CFF'],[cta,28,34,'#FF5A3C']];
window.DUR=34;
window.draw=function(t){const s=SC.find(([,a,b])=>t>=a&&t<b)||SC[SC.length-1];x.save();s[0](t-s[1]);x.restore();
  // diagonal color wipe across cuts
  SC.forEach(([,a,,col],i)=>{if(i===0)return;const k=(t-a+.3)/.6;if(k>0&&k<1){const e=eio(k);x.save();x.fillStyle=col;x.translate(W/2,H/2);x.rotate(-.35);const w=2600;const pos=lerp(-w,w,e);x.fillRect(pos-w/2,-1600,w*.55,3200);x.restore();}});
  const fo=p(t,33.4,34);if(fo>0){x.fillStyle=`rgba(0,0,0,${fo})`;x.fillRect(0,0,W,H);}};
draw(1);
</script></body></html>
