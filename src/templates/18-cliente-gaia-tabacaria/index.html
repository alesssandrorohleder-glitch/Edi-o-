<!doctype html><html><head><meta charset="utf-8">
<style>@font-face{font-family:Bebas;src:url(fonts/bebas.woff2)}@font-face{font-family:Cinzel;font-weight:700;src:url(fonts/cinzel700.woff2)}
html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="frames/meta.js"></script>
<script>
/* 18 — CLIENTE Gaia Tabacaria (Cerro Largo/RS) · 128bpm · 78 tempos = 36,56s
   Quadros: frames/C####/%04d.jpg (60fps, estabilizados e com cor uniformizada por preparar_frames.py).
   Render: node render_gaia.js (carrega os quadros sob demanda com window.prep(t) antes de draw(t)). */
const W=1080,H=1920,c=document.getElementById('c');let x=c.getContext('2d');const X0=x;
const BT=60/128,BAR=BT*4;
const GRN='#7FBF3F',GRN2='#2F6B2A',DK='#08130C',PUR='#7B4BB0',GOLD='#D9A441',CRM='#F3EBD8';
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),p=(t,a,b)=>cl((t-a)/(b-a)),lerp=(a,b,k)=>a+(b-a)*k;
const eo=t=>1-Math.pow(1-t,3),eo5=t=>1-Math.pow(1-t,5),eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,ei=t=>t*t*t;
const back=(t,s=1.7)=>{if(t<=0)return 0;if(t>=1)return 1;const c3=s+1;return 1+c3*Math.pow(t-1,3)+s*Math.pow(t-1,2)};
const rnd=s=>{const r=Math.sin(s*127.1+311.7)*43758.5453;return r-Math.floor(r)};
const b=n=>n*BT;

/* ---------- edição (tempos em batidas) ---------- */
// [clip, inicioNoClipe(s), velocidade, batidaIni, batidaFim, opções]
const EDIT=[
 ['C4158',0.05,.6,0,8,{band:1}],                       // gancho: anel de fumaça em faixa cinema
 ['C4149',0.5,.65,8,12,{z0:1.18,z1:1.04}],             // nuvem grande
 ['C4142',0.2,1,20,24,{z0:1.12,z1:1.0}],               // loja
 ['C4127',0.3,1,24,26,{}],['C4129',0.3,1,26,28,{}],['C4134',0.4,1,28,30,{}],['C4125',0.3,1,30,32,{}], // narguilés
 ['C4124',0.6,1,32,34,{}],['C4133',0.3,1,34,36,{}],    // mangueiras / pinças
 ['C4136',0.3,1,36,38,{}],['C4137',0.4,1,38,40,{}],    // carvão
 ['C4106',0.6,1,40,42,{}],['C4111',0.6,1,42,44,{}],    // essências
 ['C4115',0.5,1,44,45,{}],['C4103',1.2,1,45,46,{}],['C4145',0.8,1,46,47,{}],['C4113',0.6,1,47,48,{}], // acessórios rápidos
 ['C4157',0.75,.55,48,50,{z0:1.1,z1:1.02,hor:1,fx:.92}],['C4150',0.3,.6,50,52,{}],['C4151',0.0,.6,52,54,{}],['C4158',2.9,.55,54,56,{hor:1,fx:.55}], // fumaça
 ['C4116',0.2,.38,56,70,{dark:.62}],                    // fundo das infos
];
const FPS=60,CACHE=new Map();
function fname(cl2,i){const n=(window.META&&META[cl2])?META[cl2].n:9999;i=Math.max(1,Math.min(n,i));return `frames/${cl2}/${String(i).padStart(4,'0')}.jpg`;}
function idx(e,t){return Math.round((e[1]+(t-b(e[3]))*e[2])*FPS)+1;}
function need(t){const out=[];EDIT.forEach(e=>{if(t>=b(e[3])-.15&&t<b(e[4])+.15)out.push(fname(e[0],idx(e,cl(t,b(e[3]),b(e[4])-1e-3))));});return out;}
function load(src){if(CACHE.has(src))return CACHE.get(src);const im=new Image();const pr=new Promise(r=>{im.onload=im.onerror=()=>r(im);});im.src=src;const o={im,pr};CACHE.set(src,o);
  if(CACHE.size>60){const k=CACHE.keys().next().value;CACHE.delete(k);}return o;}
window.prep=async function(t){await Promise.all(need(t).map(s=>load(s).pr));};
function frame(e,t){const o=CACHE.get(fname(e[0],idx(e,t)));return o&&o.im.naturalWidth?o.im:null;}
function cover(im,X,Y,w,h,z=1,fx=.5,fy=.5){if(!im)return;const s=Math.max(w/im.naturalWidth,h/im.naturalHeight)*z;const dw=im.naturalWidth*s,dh=im.naturalHeight*s;
  x.drawImage(im,X+(w-dw)*fx,Y+(h-dh)*fy,dw,dh);}
function shot(e,t,{z=1,dx=0,dy=0,blur=0,dir=0}={}){const im=frame(e,t);if(!im)return;const o=e[5];const lt=t-b(e[3]),L=b(e[4])-b(e[3]);
  const zz=z*lerp(o.z0??1.1,o.z1??1.0,eo(cl(lt/Math.min(L,1.2))))*(1+.03*lt/L);
  x.save();x.translate(dx,dy);
  if(blur>0){for(let i=-3;i<=3;i++){x.globalAlpha=i?.16:.4;const off=i*blur*14;x.save();x.translate(dir?0:off,dir?off:0);cover(im,0,0,W,H,zz,o.fx??.5,.5);x.restore();}}
  else cover(im,0,0,W,H,zz,o.fx??.5,.5);
  x.restore();}

/* ---------- texto ---------- */
function T(s,X,Y,size,col,{f='Bebas',w=400,ls=0,align='center',a=1,stroke=0}={}){x.save();x.globalAlpha*=a;x.font=`${w} ${size}px ${f}`;x.letterSpacing=ls+'px';x.textAlign=align;x.textBaseline='middle';
  if(stroke){x.strokeStyle=col;x.lineWidth=stroke;x.strokeText(s,X,Y);}else{x.fillStyle=col;x.fillText(s,X,Y);}x.restore();}
function gold(y0,y1){const g=x.createLinearGradient(0,y0,0,y1);g.addColorStop(0,'#F7E2A6');g.addColorStop(.5,GOLD);g.addColorStop(1,'#9C6B1F');return g;}
// palavra entra por máscara, letra a letra, com eco em contorno
function kin(s,X,Y,size,col,t,t0,{stag=.035,f='Bebas',ls=4,echo=true,out=-1}={}){x.save();x.font=`400 ${size}px ${f}`;x.letterSpacing=ls+'px';const ws=[...s].map(ch=>x.measureText(ch).width+ls);const tw=ws.reduce((a,b2)=>a+b2,0)-ls;x.restore();
  const ok=out>0?eio(p(t,out,out+.25)):0;let cx=X-tw/2;
  x.save();x.beginPath();x.rect(0,Y-size*.62,W,size*1.2);x.clip();
  [...s].forEach((ch,i)=>{const k=eo5(p(t,t0+i*stag,t0+i*stag+.4));if(k>0){const yy=Y+(1-k)*size*1.05-ok*size*1.1;
    if(echo&&k<1)T(ch,cx+ws[i]/2,yy+size*.25*(1-k),size,col,{f,stroke:2,a:.5*(1-k)});
    T(ch,cx+ws[i]/2,yy,size,col,{f});}cx+=ws[i];});x.restore();}
function slam(s,X,Y,size,col,t,t0,o={}){const k=p(t,t0,t0+.18);if(k<=0)return;const sc=lerp(1.6,1,eo(k));x.save();x.translate(X,Y);x.scale(sc,sc);T(s,0,0,size,col,{...o,a:cl(k*2.5)*(o.a??1)});x.restore();}
function tag(s,X,Y,t,t0,{size=40,bg='rgba(8,19,12,.72)',fg=CRM,line=GRN}={}){const k=eo5(p(t,t0,t0+.45));if(k<=0)return;x.save();x.font=`400 ${size}px Bebas`;x.letterSpacing='6px';const w=x.measureText(s).width+60;
  x.translate(X,Y);x.beginPath();x.rect(-w/2,-size,w*k,size*2);x.clip();x.fillStyle=bg;x.fillRect(-w/2,-size*.85,w,size*1.7);x.fillStyle=line;x.fillRect(-w/2,-size*.85,8,size*1.7);T(s,8,4,size,fg,{ls:6});x.restore();}

/* ---------- fumaça, luz, grão ---------- */
const SM=(()=>{const cv=document.createElement('canvas');cv.width=cv.height=256;const g=cv.getContext('2d');for(let i=0;i<14;i++){const X=128+(rnd(i)-.5)*110,Y=128+(rnd(i+5)-.5)*110,r=40+rnd(i+9)*60;const gr=g.createRadialGradient(X,Y,0,X,Y,r);gr.addColorStop(0,'rgba(235,240,232,.10)');gr.addColorStop(1,'rgba(235,240,232,0)');g.fillStyle=gr;g.fillRect(0,0,256,256);}return cv;})();
function smoke(t,n=16,a=1,seed=0,col=null){x.save();x.globalCompositeOperation='screen';for(let i=0;i<n;i++){const s=i+seed*31;const life=6+rnd(s)*5;const k=((t+rnd(s+1)*life)/life)%1;const X=rnd(s+2)*W+Math.sin(t*.4+s)*80,Y=H*1.05-k*H*1.2;const sz=380+rnd(s+3)*520+k*400;
  x.globalAlpha=a*Math.sin(k*Math.PI)*.85;x.save();x.translate(X,Y);x.rotate(t*.15*(rnd(s+4)-.5)+s);x.drawImage(SM,-sz/2,-sz/2,sz,sz);x.restore();}x.restore();}
function sparks(t,n=40,a=1){x.save();x.globalCompositeOperation='lighter';for(let i=0;i<n;i++){const life=3+rnd(i)*3;const k=((t+rnd(i+1)*life)/life)%1;const X=rnd(i+2)*W+Math.sin(t+i)*30,Y=H-k*H*.9;x.globalAlpha=a*Math.sin(k*Math.PI)*(.4+.6*rnd(i+3));
  x.fillStyle=i%3?'#FFC46B':'#B6E36B';x.beginPath();x.arc(X,Y,1.5+rnd(i+4)*2.5,0,7);x.fill();}x.restore();}
function leak(t,k,col1='rgba(127,191,63,.55)',col2='rgba(123,75,176,.5)'){if(k<=0)return;x.save();x.globalCompositeOperation='screen';const X=lerp(-400,W+400,k);
  let g=x.createRadialGradient(X,H*.35,0,X,H*.35,900);g.addColorStop(0,col1);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
  g=x.createRadialGradient(W-X,H*.7,0,W-X,H*.7,800);g.addColorStop(0,col2);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,W,H);x.restore();}
const NZ=document.createElement('canvas');NZ.width=NZ.height=256;{const g=NZ.getContext('2d'),d=g.createImageData(256,256);for(let i=0;i<d.data.length;i+=4){const v=128+(rnd(i*.37)-.5)*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}g.putImageData(d,0,0);}
function grain(t,a=.06){x.save();x.globalAlpha=a;x.globalCompositeOperation='overlay';const f=Math.floor(t*30);const ox=-rnd(f)*256,oy=-rnd(f+7)*256;for(let X=ox;X<W;X+=256)for(let Y=oy;Y<H;Y+=256)x.drawImage(NZ,X,Y);x.restore();}
function vign(a=.55){const g=x.createRadialGradient(W/2,H*.5,H*.28,W/2,H*.5,H*.8);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${a})`);x.fillStyle=g;x.fillRect(0,0,W,H);}
function shade(y0,y1,a=.7,up=false){const g=x.createLinearGradient(0,y0,0,y1);g.addColorStop(up?1:0,'rgba(4,10,6,0)');g.addColorStop(up?0:1,`rgba(4,10,6,${a})`);x.fillStyle=g;x.fillRect(0,y0,W,y1-y0);}

/* ---------- logo do cliente (arte original, sem alterar) ---------- */
const LOGO=new Image();LOGO.src='logo_gaia.png';let LM=null;
function logoMasked(){if(LM||!LOGO.naturalWidth)return LM;const S=LOGO.naturalWidth;const cv=document.createElement('canvas');cv.width=cv.height=S;const g=cv.getContext('2d');g.drawImage(LOGO,0,0);
  g.globalCompositeOperation='destination-in';const r=g.createRadialGradient(S/2,S*.52,S*.36,S/2,S*.52,S*.5);r.addColorStop(0,'rgba(0,0,0,1)');r.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=r;g.fillRect(0,0,S,S);return LM=cv;}
function logo(X,Y,size,k,{glow=1}={}){const L=logoMasked();if(!L||k<=0)return;const e=eo5(k);x.save();x.globalAlpha=cl(k*1.6);x.translate(X,Y);x.scale(lerp(1.25,1,e),lerp(1.25,1,e));
  if(glow>0){const g=x.createRadialGradient(0,0,0,0,0,size*.7);g.addColorStop(0,`rgba(127,191,63,${.22*glow})`);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(-size,-size,size*2,size*2);}
  if(k<1){x.filter=`blur(${(1-e)*14}px)`;}x.drawImage(L,-size/2,-size/2,size,size);x.filter='none';x.restore();}
function bgDark(t){const g=x.createRadialGradient(W/2,H*.42,50,W/2,H*.5,H*.75);g.addColorStop(0,'#13301B');g.addColorStop(.6,'#0A1A0F');g.addColorStop(1,'#030805');x.fillStyle=g;x.fillRect(0,0,W,H);}

/* ================= CENAS ================= */
function S0(t){ // 0–8b gancho: faixa cinema com o anel de fumaça → abre para tela cheia
  x.fillStyle='#030604';x.fillRect(0,0,W,H);const e=EDIT[0];const im=frame(e,t);
  const op=eio(p(t,b(6),b(8)));const bh=lerp(608,H,op),by=(H-bh)/2;const intro=eo5(p(t,0,b(1.5)));
  x.save();x.beginPath();x.rect(0,by+(1-intro)*bh/2,W,bh*intro);x.clip();cover(im,0,by,W,bh,lerp(1.06,1.0,p(t,0,b(6)))*lerp(1,1.15,op),lerp(.5,.45,op),.5);x.restore();
  x.fillStyle=GOLD;const lw=W*eo5(p(t,b(.5),b(2)));x.globalAlpha=1-op;x.fillRect(W/2-lw/2,by-14,lw,3);x.fillRect(W/2-lw/2,by+bh+11,lw,3);x.globalAlpha=1;
  kin('O RITUAL',W/2,lerp(470,330,op),190,CRM,t,b(2),{out:b(7.2)});
  kin('COMEÇA AQUI.',W/2,lerp(1450,1590,op),150,gold(1380,1520),t,b(4),{out:b(7.2)});
  smoke(t,8,.6,1);
}
function S1(t){shot(EDIT[1],t);shade(1200,H,.6);smoke(t,10,.5,2);sparks(t,30,.6);
  slam('SINTA',W/2,560,210,CRM,t,b(8)+.02);slam('O SABOR',W/2,760,210,gold(680,840),t,b(10));}
function S2(t){ // 12–20b logo
  bgDark(t);const lt=t-b(12);
  // raios de luz
  x.save();x.globalCompositeOperation='screen';x.translate(W/2,860);x.rotate(lt*.08);for(let i=0;i<12;i++){x.rotate(Math.PI/6);x.globalAlpha=.05*eo(p(lt,.3,1.5));x.fillStyle=i%2?GRN:PUR;x.beginPath();x.moveTo(0,0);x.lineTo(1500,-120);x.lineTo(1500,120);x.fill();}x.restore();
  smoke(t,14,.9,3);logo(W/2,860,980,p(lt,.05,1.1));sparks(t,50,eo(p(lt,.6,1.6)));
  // contorno de luz que varre
  leak(t,p(lt,1.0,2.2));
  tag('CERRO LARGO · RS',W/2,1430,t,b(15),{size:46});
}
function cutShot(i,t,{whip=true}={}){const e=EDIT[i];const s0=b(e[3]),s1=b(e[4]);const lt=t-s0;const wi=whip?Math.max(0,1-lt/.12):0,wo=whip?Math.max(0,(t-(s1-.1))/.1):0;
  const dir=i%2;const off=(wi>0?(i%2?1:-1)*wi*260:0)+(wo>0?(i%2?-1:1)*wo*260:0);shot(e,t,{blur:Math.max(wi,wo),dir,dx:dir?0:off,dy:dir?off:0,z:1+.06*Math.exp(-lt*10)});}
function S3(t){cutShot(2,t);shade(0,900,.85,true);shade(1250,H,.7);
  kin('TUDO PRO',W/2,520,170,CRM,t,b(20.2));kin('SEU MOMENTO',W/2,690,170,gold(620,760),t,b(21));}
function prod(i0,i1,word,t,t0,sub){const i=EDIT.findIndex((e,k)=>k>=i0&&k<=i1&&t>=b(e[3])&&t<b(e[4]));cutShot(i<0?i1:i,t);shade(1150,H,.8);shade(0,520,.55,true);
  kin(word,W/2,1380,word.length>9?190:240,CRM,t,t0+.04,{stag:.03});if(sub)tag(sub,W/2,1530,t,t0+.35,{size:42});}
function S4(t){prod(3,6,'NARGUILÉS',t,b(24),'KITS · ROSH · ABAFADORES');}
function S5(t){prod(7,8,'ACESSÓRIOS',t,b(32),'MANGUEIRAS · PINÇAS');}
function S6(t){prod(9,10,'CARVÃO',t,b(36),'DE COCO · QUEIMA LIMPA');}
function S7(t){prod(11,12,'ESSÊNCIAS',t,b(40),'VÁRIOS SABORES');}
function S8(t){prod(13,16,'E MUITO MAIS',t,b(44),'SEDAS · TRITURADORES · CASES');}
function S9(t){ // 48–56b fumaça
  const i=EDIT.findIndex((e,k)=>k>=17&&k<=20&&t>=b(e[3])&&t<b(e[4]));const e=EDIT[i<0?20:i];const lt=t-b(e[3]);
  const k=eio(cl(lt/.3));x.save();if(lt<.3&&i>17){const pe=EDIT[i-1];shot(pe,b(pe[4])-1e-3);x.globalAlpha=k;}shot(e,t);x.restore();
  leak(t,(t-b(48))/(b(8)),'rgba(123,75,176,.35)','rgba(127,191,63,.3)');
  T('VIVA A',W/2,1290,120,CRM,{a:eo(p(t,b(49),b(50)))*(1-p(t,b(55.3),b(56)))});
  kin('EXPERIÊNCIA',W/2,1430,190,gold(1360,1500),t,b(49.5));
}
function infoBg(t){shot(EDIT[21],t,{z:1.1});x.fillStyle=`rgba(5,14,8,${EDIT[21][5].dark})`;x.fillRect(0,0,W,H);smoke(t,10,.6,5);}
function icon(type,X,Y,k){if(k<=0)return;x.save();x.translate(X,Y);x.scale(k,k);x.strokeStyle=GOLD;x.lineWidth=7;x.lineCap='round';x.beginPath();x.arc(0,0,74,0,7);x.stroke();x.lineWidth=6;
  if(type==='moto'){x.beginPath();x.arc(-28,22,16,0,7);x.arc(32,22,16,0,7);x.moveTo(-28,22);x.lineTo(-6,-10);x.lineTo(22,-10);x.lineTo(32,22);x.moveTo(-6,-10);x.lineTo(-14,-24);x.moveTo(22,-10);x.lineTo(28,-28);x.stroke();}
  if(type==='clock'){x.beginPath();x.arc(0,0,40,0,7);x.moveTo(0,0);x.lineTo(0,-26);x.moveTo(0,0);x.lineTo(18,10);x.stroke();}
  if(type==='cal'){x.strokeRect(-34,-28,68,58);x.beginPath();x.moveTo(-34,-12);x.lineTo(34,-12);x.moveTo(-18,-36);x.lineTo(-18,-22);x.moveTo(18,-36);x.lineTo(18,-22);x.stroke();}
  x.restore();}
function card(Y,t,t0,ic,l1,l2,hl){const k=eo5(p(t,t0,t0+.5));if(k<=0)return;x.save();x.globalAlpha=k;x.translate((1-k)*-120,0);
  x.fillStyle='rgba(8,19,12,.78)';x.strokeStyle='rgba(217,164,65,.6)';x.lineWidth=3;x.beginPath();x.roundRect(110,Y-110,860,220,26);x.fill();x.stroke();
  icon(ic,230,Y,back(p(t,t0+.15,t0+.55)));x.fillStyle='rgba(217,164,65,.5)';x.fillRect(330,Y-70,3,140);
  T(l1,370,Y-34,62,CRM,{align:'left',ls:2});T(l2,370,Y+36,62,hl?GOLD:CRM,{align:'left',ls:2});x.restore();}
function S10(t){infoBg(t); // 56–60b teleentrega
  kin('SEXTA-FEIRA É DIA DE',W/2,420,96,CRM,t,b(56.1),{stag:.015});
  kin('TELEENTREGA',W/2,580,230,gold(500,660),t,b(56.6),{stag:.03});
  card(860,t,b(57.6),'cal','FAÇA SEU PEDIDO','DURANTE A SEMANA');
  card(1110,t,b(58.6),'clock','PEDIDOS ATÉ','SEXTA, MEIO-DIA',true);
  card(1360,t,b(59.6),'moto','SAÍMOS DE CERRO LARGO','AO MEIO-DIA EM PONTO');
}
function S11(t){infoBg(t); // 64–70b horários
  kin('HORÁRIOS',W/2,520,230,gold(440,600),t,b(64.1));
  tag('DE ATENDIMENTO',W/2,690,t,b(64.6),{size:46});
  card(960,t,b(65),'cal','QUARTA E QUINTA','11H ÀS 15H',true);
  card(1220,t,b(65.6),'cal','SÁBADO E DOMINGO','11H ÀS 15H',true);
}
function S12(t){ // 70–78b final
  bgDark(t);const lt=t-b(70);smoke(t,16,.9,7);logo(W/2,780,860,p(lt,.05,1.0));sparks(t,40,.8);
  const hk=eo5(p(lt,b(2),b(3)));if(hk>0){x.save();x.globalAlpha=hk;x.translate(W/2,1290+(1-hk)*30);x.fillStyle=gold(1240,1340);x.beginPath();x.roundRect(-380,-62,760,124,62);x.fill();T('@GAIA.TABACARIA',0,5,72,DK,{ls:3});x.restore();}
  T('CERRO LARGO · RS',W/2,1420,52,CRM,{ls:8,a:eo(p(lt,b(3),b(4)))});
