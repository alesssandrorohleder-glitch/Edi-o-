<!doctype html><html><head><style>@font-face{font-family:Corm;font-weight:300;src:url(fonts/corm300.woff2)}@font-face{font-family:Jost;font-weight:400;src:url(fonts/jost400.woff2)}@font-face{font-family:Jost;font-weight:300;src:url(fonts/jost300.woff2)}</style></head>
<body style="margin:0;background:#000"><canvas id="g"></canvas>
<script type="module">
// Imagens estáticas dos produtos RITTÚ (2048x2048): window.shot(nome, limpo) renderiza uma vista.
import * as THREE from './lib/three.module.min.js';import {build} from './scene3d.js';
for(const f of ['300 50px Corm','400 50px Jost','300 50px Jost'])await document.fonts.load(f);
const R=new THREE.WebGLRenderer({canvas:document.getElementById('g'),antialias:true,alpha:true,preserveDrawingBuffer:true});const QS=new URLSearchParams(location.search);const CW=+(QS.get('w')||2048),CH=+(QS.get('h')||2048);R.setSize(CW,CH,false);R.setClearColor(0x000000,0);
const S=build(R);
const V={
 serum_frente:{hero:{ry:0},cam:[0,2.3,15.5],look:[0,2.3,0],fov:24},
 serum_34:{hero:{ry:.55},cam:[4.2,3.6,14.4],look:[0,2.3,0],fov:24},
 serum_lateral:{hero:{ry:1.57},cam:[0,2.3,15.5],look:[0,2.3,0],fov:24},
 serum_aberto:{hero:{ry:.3,dropper:2.7},cam:[2.2,3.6,21],look:[0,3.6,0],fov:24},
 serum_detalhe_colar:{hero:{ry:.4},cam:[1.0,3.6,3.6],look:[0,3.3,0],fov:28},
 pote_fechado:{jar:{ry:0},cam:[0,2.6,9.5],look:[0,1.0,0],fov:24},
 pote_aberto:{jar:{ry:.3,lid:1.7,lidr:-.3},cam:[0,6.4,8.4],look:[0,1.3,0],fov:26},
 pote_topo_creme:{jar:{ry:0,lid:40},cam:[0,8.5,1.2],look:[0,1.2,0],fov:28},
 colecao:{line:{ry:0},cam:[0,2.8,14],look:[0,1.7,0],fov:28},
 v_serum:{hero:{ry:.35},cam:[1.2,2.6,13.5],look:[0,2.4,0],fov:30},
 v_pote:{jar:{ry:.3,lid:1.6,lidr:-.25},cam:[0,4.6,10.5],look:[0,1.5,0],fov:30},
 v_podio:{line:{ry:.15},cam:[0,3.0,15.5],look:[0,2.2,0],fov:30},
 colecao_34:{line:{ry:.45},cam:[3,4,13],look:[0,1.6,0],fov:28},
};
window.names=Object.keys(V);
window.shot=(n,clean)=>{const st={...V[n],clean,bgI:1.05,bgW:.42,t:3};S.set(st);S.cam.aspect=CW/CH;S.cam.updateProjectionMatrix();R.render(S.scene,S.cam);return document.getElementById('g').toDataURL('image/png');};
window.ready=true;
</script></body></html>
