<body><canvas id="c" width="1080" height="1920"></canvas><canvas id="g3" class="off" width="1080" height="1920"></canvas>
<script type="module">
/* 24 — FORJA · academia 24h (portfólio fictício) · energia alta, cena nova a cada 2s (120bpm, BT=0,5s), 32s
   Halter / anilha / kettlebell em 3D (three.js: borracha + aço) com impacto e tremor de câmera; tipografia esportiva inclinada;
   ECG, app de check-in, anéis de progresso, relógio 24H, preço, selo. */
import * as THREE from './lib/three.module.min.js';import {RoomEnvironment} from './lib/RoomEnvironment.js';
for(const f of ['50px Bebas','500 40px Inter','600 40px Inter','800 40px InterD'])await document.fonts.load(f);
const W=1080,H=1920,c=document.getElementById('c'),X0=c.getContext('2d');let x=X0;
const BLK='#0B0B0C',CHAR='#18181B',RED='#FF2E2E',WHT='#F2F2F2',STEEL='#9AA0A6';
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),p=(t,a,b)=>cl((t-a)/(b-a)),lerp=(a,b,k)=>a+(b-a)*k;
const eo=t=>1-Math.pow(1-t,3),eo5=t=>1-Math.pow(1-t,5),eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,ei=t=>t*t*t;
const spr=t=>t<=0?0:1-Math.exp(-8*t)*Math.cos(12*t);const rnd=s=>{const r=Math.sin(s*127.1+311.7)*43758.5453;return r-Math.floor(r)};
const BT=.5,kick=t=>Math.exp(-(t%BT)*7),SK=-.16; // inclinação esportiva
function T(s,X,Y,size,col,{f='Bebas',w='',ls=0,al='center',a=1,sk=0,stroke=0}={}){if(a<=0)return;x.save();x.globalAlpha*=a;x.translate(X,Y);if(sk)x.transform(1,0,sk,1,0,0);x.font=`${w} ${size}px ${f}`;x.letterSpacing=ls+'px';x.textAlign=al;x.textBaseline='middle';
  if(stroke){x.strokeStyle=col;x.lineWidth=stroke;x.strokeText(s,0,0);}else{x.fillStyle=col;x.fillText(s,0,0);}x.restore();}
function tw(s,size,f='Bebas',w='',ls=0){x.save();x.font=`${w} ${size}px ${f}`;x.letterSpacing=ls+'px';const m=x.measureText(s).width;x.restore();return m;}
const fit=(s,wid,max=900)=>Math.min(max,wid/tw(s,100)*100);
function rr(X,Y,w,h,r){x.beginPath();x.roundRect(X,Y,w,h,r);}
function mask(s,X,Y,size,col,t,t0,o={}){const k=eo5(p(t,t0,t0+(o.dur??.35)));if(k<=0)return;x.save();x.beginPath();x.rect(0,Y-size*.9,W,size*1.55);x.clip();
  const dx=o.from?(1-k)*o.from*W:0,dy=o.from?0:(1-k)*size*1.3;if(col==='chrome'){hotText(s,X+dx,Y+dy,size,0,{sk:o.sk??SK});x.restore();return;}T(s,X+dx,Y+dy,size,col,{f:o.f??'Bebas',w:o.w??'',al:o.al??'center',ls:o.ls??0,sk:o.sk??SK,stroke:o.stroke});x.restore();}
// tremor de câmera após impactos
const HITS=[0,.5,1,1.5,4.0,8.17,8.67,9.17,9.67,22.85,24.25,26.0];const shakeAt=t=>{let a=0;for(const h of HITS){const d=t-h;if(d>=0&&d<.4)a+=Math.exp(-d*12)*18;}return [Math.sin(t*93)*a,Math.cos(t*71)*a];};
/* ---------------- fundo e elementos sempre em movimento ---------------- */
function bgDark(t,glow=RED){x.fillStyle=BLK;x.fillRect(0,0,W,H);const g=x.createRadialGradient(W/2,H*.55,0,W/2,H*.55,H*.6);g.addColorStop(0,'rgba(255,46,46,.16)');g.addColorStop(1,'rgba(255,46,46,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.save();x.globalAlpha=.06;x.strokeStyle=WHT;x.lineWidth=2;for(let i=-4;i<14;i++){const X=((i*140+t*260)%(W+560))-280;x.beginPath();x.moveTo(X,0);x.lineTo(X-500,H);x.stroke();}x.restore();}
const PT=[...Array(60)].map((_,i)=>({x:rnd(i)*W,y:rnd(i+3)*H,s:1.5+rnd(i+7)*3.5,v:120+rnd(i+11)*260}));
function sparks(t,col=RED,a=.7){x.save();x.fillStyle=col;PT.forEach((q,i)=>{const Y=((q.y-t*q.v)%H+H)%H;x.globalAlpha=a*(.3+.7*Math.sin(t*4+i)**2);x.fillRect(q.x+Math.sin(t*2+i)*10,Y,q.s,q.s*4);});x.restore();}
function stripes(t,Y,ang,bg,fg,txt,speed=520,size=80){x.save();x.translate(W/2,Y);x.rotate(ang);x.fillStyle=bg;x.fillRect(-W,-size*.62,W*2,size*1.24);const w=tw(txt,size);let X=-W-((t*speed)%w+w)%w;while(X<W){T(txt,X,4,size,fg,{al:'left'});X+=w;}x.restore();}
function burst(t,t0,X,Y,col=WHT,n=26){const s=t-t0;if(s<0||s>.8)return;x.save();for(let i=0;i<n;i++){const an=-Math.PI+rnd(i+t0)*Math.PI,v=300+rnd(i+9)*700;x.globalAlpha=1-s/.8;x.fillStyle=col;x.beginPath();x.arc(X+Math.cos(an)*v*s,Y+Math.sin(an)*v*s*.5+600*s*s,4+rnd(i)*5,0,7);x.fill();}x.restore();}

/* ---------------- 3D: halter, anilha, kettlebell ---------------- */
const G3=document.getElementById('g3');const R3=new THREE.WebGLRenderer({canvas:G3,antialias:true,alpha:true,preserveDrawingBuffer:true});R3.setSize(W,H,false);R3.setClearColor(0,0);
R3.toneMapping=THREE.ACESFilmicToneMapping;R3.toneMappingExposure=1.1;R3.outputColorSpace=THREE.SRGBColorSpace;
const S3=new THREE.Scene();S3.environment=new THREE.PMREMGenerator(R3).fromScene(new RoomEnvironment(),.04).texture;const C3=new THREE.PerspectiveCamera(30,W/H,.1,200);C3.position.set(0,0,30);
const K3=new THREE.DirectionalLight('#ffffff',2.2);K3.position.set(-6,9,10);S3.add(K3);const RIM=new THREE.DirectionalLight('#ff3b3b',3.5);RIM.position.set(8,2,-6);S3.add(RIM);
function cvTex(w,h,fn){const cv=document.createElement('canvas');cv.width=w;cv.height=h;fn(cv.getContext('2d'),w,h);const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t;}
const rubber=new THREE.MeshPhysicalMaterial({color:'#141416',roughness:.55,clearcoat:.35,clearcoatRoughness:.4});
const steel=new THREE.MeshPhysicalMaterial({color:'#d8dbe0',metalness:1,roughness:.22});
const knurl=cvTex(512,64,(g,w,h)=>{g.fillStyle='#888';g.fillRect(0,0,w,h);g.strokeStyle='#333';g.lineWidth=2;for(let i=-h;i<w;i+=8){g.beginPath();g.moveTo(i,0);g.lineTo(i+h,h);g.stroke();g.beginPath();g.moveTo(i+h,0);g.lineTo(i,h);g.stroke();}});
const handleM=new THREE.MeshPhysicalMaterial({color:'#cfd2d6',metalness:1,roughness:.35,bumpMap:knurl,bumpScale:.6});
const redM=new THREE.MeshStandardMaterial({color:RED,roughness:.4,emissive:'#5a0000'});
// halter sextavado
const DB=new THREE.Group();S3.add(DB);{const hd=new THREE.Mesh(new THREE.CylinderGeometry(.24,.24,3.4,32),handleM);hd.rotation.z=Math.PI/2;DB.add(hd);
  const hotM=new THREE.MeshPhysicalMaterial({color:'#2a2b2e',metalness:.85,roughness:.35,emissive:'#000'});window.HOTM=hotM;for(const s of [-1,1]){const head=new THREE.Mesh(new THREE.CylinderGeometry(1.05,1.05,1.25,6),hotM);head.rotation.z=Math.PI/2;head.position.x=s*2.35;DB.add(head);
    const col=new THREE.Mesh(new THREE.CylinderGeometry(.48,.48,.22,32),steel);col.rotation.z=Math.PI/2;col.position.x=s*1.62;DB.add(col);
    const cap=new THREE.Mesh(new THREE.CylinderGeometry(.62,.62,.04,40),steel);cap.rotation.z=Math.PI/2;cap.position.x=s*2.99;DB.add(cap);
    const ring=new THREE.Mesh(new THREE.TorusGeometry(.78,.05,10,48),redM);ring.rotation.y=Math.PI/2;ring.position.x=s*3.0;DB.add(ring);}}
// anilha bumper com face texturizada
const PLT=cvTex(1024,1024,(g,w,h)=>{g.fillStyle='#141416';g.fillRect(0,0,w,h);const cx=w/2;g.strokeStyle='#26262a';g.lineWidth=10;for(const r of [470,330,240]){g.beginPath();g.arc(cx,cx,r,0,7);g.stroke();}
  g.fillStyle=RED;g.font='150px Bebas';g.textAlign='center';g.textBaseline='middle';g.fillText('20 KG',cx,cx-360);g.fillStyle='#E8E8E8';g.font='120px Bebas';g.letterSpacing='18px';g.fillText('FORJA',cx,cx+370);
  g.fillStyle='#bfc3c8';g.beginPath();g.arc(cx,cx,150,0,7);g.fill();g.fillStyle='#050505';g.beginPath();g.arc(cx,cx,85,0,7);g.fill();});
const PL=new THREE.Group();S3.add(PL);{const face=new THREE.MeshPhysicalMaterial({map:PLT,roughness:.5,clearcoat:.4});const m=new THREE.Mesh(new THREE.CylinderGeometry(4.2,4.2,1.0,96),[rubber,face,face]);m.rotation.x=Math.PI/2;PL.add(m);
  const lip=new THREE.Mesh(new THREE.TorusGeometry(4.2,.12,12,96),rubber);PL.add(lip);}
// kettlebell
const KB=new THREE.Group();S3.add(KB);{const body=new THREE.Mesh(new THREE.SphereGeometry(1.9,64,48),rubber);body.scale.set(1,.92,1);KB.add(body);const base=new THREE.Mesh(new THREE.CylinderGeometry(1.1,1.2,.3,48),rubber);base.position.y=-1.75;KB.add(base);
  const hdl=new THREE.Mesh(new THREE.TorusGeometry(1.15,.26,20,64,Math.PI*1.25),handleM);hdl.position.y=1.65;hdl.rotation.z=-Math.PI*.125;KB.add(hdl);
  const band=new THREE.Mesh(new THREE.TorusGeometry(1.75,.07,10,64),redM);band.rotation.x=Math.PI/2;band.position.y=.55;KB.add(band);
  const lbl=new THREE.Mesh(new THREE.CircleGeometry(.7,40),new THREE.MeshStandardMaterial({map:cvTex(256,256,(g)=>{g.fillStyle=RED;g.beginPath();g.arc(128,128,128,0,7);g.fill();g.fillStyle='#fff';g.font='130px Bebas';g.textAlign='center';g.textBaseline='middle';g.fillText('16',128,138);}),roughness:.5}));lbl.position.set(0,0,1.82);KB.add(lbl);}
function render3D(st){if(window.HOTM){const c=heatRGB(HEATDB);const k=0;window.HOTM.emissive.setRGB(c[0]/255*k,c[1]/255*k*.8,c[2]/255*k*.6);}DB.visible=!!st.db;PL.visible=!!st.pl;KB.visible=!!st.kb;
  for(const [o,s] of [[DB,st.db],[PL,st.pl],[KB,st.kb]])if(s){o.position.set(...s.pos);o.rotation.set(s.rx||0,s.ry||0,s.rz||0);o.scale.setScalar(s.s||1);}
  K3.position.set(-6+Math.sin(st.t*1.3)*5,9,10);R3.render(S3,C3);x.drawImage(G3,0,0);}

/* ---------------- celular 2D (check-in) ---------------- */
function phone(cx,cy,s,rot,fn){x.save();x.translate(cx,cy);x.rotate(rot);x.scale(s,s);x.shadowColor='rgba(0,0,0,.6)';x.shadowBlur=60;x.shadowOffsetY=30;rr(-280,-590,560,1180,88);x.fillStyle='#111214';x.fill();x.shadowColor='transparent';
  x.strokeStyle='#3a3d42';x.lineWidth=5;rr(-277,-587,554,1174,85);x.stroke();x.save();rr(-260,-570,520,1140,70);x.clip();x.translate(-260,-570);fn();x.restore();x.fillStyle='#000';rr(-62,-552,124,36,18);x.fill();x.restore();}

/* ---------------- conceito FORJA: metal em brasa → aço ---------------- */
const HOTC=[[0,[70,74,80]],[.18,[90,14,6]],[.38,[200,40,10]],[.58,[255,110,20]],[.78,[255,200,90]],[1,[255,248,225]]];
const heatRGB=h=>{h=cl(h);for(let i=1;i<HOTC.length;i++)if(h<=HOTC[i][0]){const [a,ca]=HOTC[i-1],[b,cb]=HOTC[i],k=(h-a)/(b-a);return ca.map((v,j)=>Math.round(lerp(v,cb[j],k)));}return HOTC[HOTC.length-1][1];};
const heatCol=(h,a=1)=>{const c=heatRGB(h);return `rgba(${c[0]},${c[1]},${c[2]},${a})`;};
// texto em brasa: brilho + cor de corpo negro; frio = aço escovado
function hotText(s,X,Y,size,h,{sk=SK,a=1}={}){x.save();x.globalAlpha*=a;x.translate(X,Y);x.transform(1,0,sk,1,0,0);x.font=`${size}px Bebas`;x.textAlign='center';x.textBaseline='middle';
  if(h>.15){x.shadowColor=heatCol(Math.min(1,h+.1),.9);x.shadowBlur=20+60*h;}
  if(h<.25){const g=x.createLinearGradient(0,-size*.45,0,size*.45);g.addColorStop(0,'#F4F5F7');g.addColorStop(.48,'#9CA2AA');g.addColorStop(.52,'#6E747C');g.addColorStop(1,'#D9DCE0');x.fillStyle=g;x.fillText(s,0,0);x.shadowBlur=0;
    if(h>0){x.globalAlpha*=h/.25;x.fillStyle=heatCol(.35);x.fillText(s,0,0);}}
  else{const g=x.createLinearGradient(0,-size*.45,0,size*.45);g.addColorStop(0,heatCol(h));g.addColorStop(.5,heatCol(Math.min(1,h+.12)));g.addColorStop(1,heatCol(h*.8));x.fillStyle=g;x.fillText(s,0,0);}
  x.restore();}
// faíscas de forja: sobem rápido, caem com gravidade, rastro
function forgeSparks(t,t0,X,Y,n=40,pow=1){const s=t-t0;if(s<0||s>1.2)return;x.save();x.globalCompositeOperation='lighter';x.lineCap='round';
  for(let i=0;i<n;i++){const an=-Math.PI/2+(rnd(i+t0*7)-.5)*2.4,v=(500+rnd(i+3)*1300)*pow,life=.5+rnd(i+5)*.7;if(s>life)continue;const k=s/life;
    const px=X+Math.cos(an)*v*s,py=Y+Math.sin(an)*v*s+900*s*s,vx=Math.cos(an)*v,vy=Math.sin(an)*v+1800*s;const L=.025;
    x.strokeStyle=heatCol(1-k*.6,1-k);x.lineWidth=2+3*(1-k);x.beginPath();x.moveTo(px,py);x.lineTo(px-vx*L,py-vy*L);x.stroke();}x.restore();}
function embers(t,a=.8){x.save();x.globalCompositeOperation='lighter';PT.forEach((q,i)=>{const Y=((q.y-t*q.v*.6)%H+H)%H,h=.5+.5*Math.sin(t*5+i);x.fillStyle=heatCol(.55+.4*h,a*(.3+.7*h));x.beginPath();x.arc(q.x+Math.sin(t*1.5+i)*30,Y,q.s*.8,0,7);x.fill();});x.restore();}
function steam(t,t0,X,Y,w=500,a=.5){const s=t-t0;if(s<0)return;x.save();for(let i=0;i<22;i++){const k=((s*.6+i/22)%1),r=60+k*260,px=X+(rnd(i)-.5)*w+Math.sin(t*1.2+i)*40,py=Y-k*900;
  const g=x.createRadialGradient(px,py,0,px,py,r);g.addColorStop(0,`rgba(235,238,242,${a*(1-k)*Math.min(1,s*2)})`);g.addColorStop(1,'rgba(235,238,242,0)');x.fillStyle=g;x.fillRect(px-r,py-r,r*2,r*2);}x.restore();}
function bgForge(t,heat=.5){x.fillStyle='#070606';x.fillRect(0,0,W,H);const g=x.createRadialGradient(W/2,H*.62,0,W/2,H*.62,H*.7);g.addColorStop(0,heatCol(.5,.35*heat));g.addColorStop(.5,heatCol(.3,.12*heat));g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,W,H);}
// metal fundido (shader)
const glc=document.createElement('canvas');glc.width=540;glc.height=960;const gl=glc.getContext('webgl',{preserveDrawingBuffer:true});
const FS=`precision highp float;uniform vec2 R;uniform float T,HEAT;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),u.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),u.x),u.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*n(p);p*=2.05;a*=.5;}return v;}
vec3 heat(float x){x=clamp(x,0.,1.);return mix(mix(vec3(.02,.01,.01),vec3(.55,.06,.02),smoothstep(0.,.35,x)),mix(vec3(1.,.45,.08),vec3(1.,.84,.45),smoothstep(.65,1.,x)),smoothstep(.3,.7,x));}
void main(){vec2 uv=gl_FragCoord.xy/R;vec2 p=uv*vec2(R.x/R.y,1.)*2.4;p.y-=T*.25;
 vec2 q=vec2(fbm(p+T*.15),fbm(p+vec2(3.1,1.7)-T*.1));float f=fbm(p+2.2*q);
 float cr=abs(fbm(p*1.6+q*1.5)-.5);float crack=smoothstep(.035,.0,cr);float glow=smoothstep(.12,.0,cr)*.35;float crust=smoothstep(.3,.55,f);
 float v=.04+.12*f+(1.-crust)*f*.55+crack*.62+glow;v*=HEAT;gl_FragColor=vec4(heat(v)+(h(gl_FragCoord.xy+fract(T)*91.)-.5)*.03,1.);}`;
function shS(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(s);return s;}
const PR=gl.createProgram();gl.attachShader(PR,shS(gl.VERTEX_SHADER,'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'));gl.attachShader(PR,shS(gl.FRAGMENT_SHADER,FS));gl.linkProgram(PR);gl.useProgram(PR);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);const AL=gl.getAttribLocation(PR,'a');gl.enableVertexAttribArray(AL);gl.vertexAttribPointer(AL,2,gl.FLOAT,false,0,0);
const UR=gl.getUniformLocation(PR,'R'),UT=gl.getUniformLocation(PR,'T'),UH=gl.getUniformLocation(PR,'HEAT');
function molten(t,heat=1,a=1){gl.viewport(0,0,540,960);gl.uniform2f(UR,540,960);gl.uniform1f(UT,t);gl.uniform1f(UH,heat);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);x.save();x.globalAlpha=a;x.drawImage(glc,0,0,W,H);x.restore();}
// bigorna + martelo (silhueta de aço)
function anvil(X,Y,s=1,glow=0){x.save();x.translate(X,Y);x.scale(s,s);const g=x.createLinearGradient(0,-120,0,200);g.addColorStop(0,'#5d636b');g.addColorStop(.15,'#2b2e33');g.addColorStop(1,'#111214');x.fillStyle=g;
  x.beginPath();x.moveTo(-330,-120);x.lineTo(260,-120);x.quadraticCurveTo(420,-110,480,-60);x.quadraticCurveTo(360,-40,240,-20);x.lineTo(150,40);x.lineTo(170,120);x.lineTo(230,200);x.lineTo(-230,200);x.lineTo(-170,120);x.lineTo(-150,40);x.lineTo(-260,-20);x.lineTo(-330,-40);x.closePath();x.fill();
  x.fillStyle='rgba(255,255,255,.35)';x.fillRect(-330,-120,590,6);if(glow>0){x.fillStyle=heatCol(.9,glow);x.beginPath();x.ellipse(0,-126,160,18,0,0,7);x.fill();}x.restore();}
function hammer(X,Y,ang,s=1){x.save();x.translate(X,Y);x.rotate(ang);x.scale(s,s);x.fillStyle='#4a2c1a';x.fillRect(-14,-560,28,560);const g=x.createLinearGradient(-110,0,110,0);g.addColorStop(0,'#3a3e44');g.addColorStop(.5,'#c9ccd1');g.addColorStop(1,'#3a3e44');x.fillStyle=g;x.fillRect(-120,-640,240,110);x.restore();}

/* ---------------- cenas (2s cada) ---------------- */
const W4=['TODO','AÇO','COMEÇA','BRUTO.'];
function hook(t){const i=Math.min(3,Math.floor(t/BT)),lt=t-i*BT;bgForge(t,.3+.2*i);embers(t,.4);const w=W4[i],s=fit(w,960,900),h=1-eo(p(lt,.05,.45))*.7;
  const sc=1.18-.18*eo5(p(lt,0,.2));x.save();x.translate(W/2,960);x.scale(sc,sc);hotText(w,0,0,s,h);x.restore();forgeSparks(t,i*BT,W/2,1180,36,.9);}
function prima(t){const lt=t-2;molten(t,lerp(.6,1,eo(p(lt,0,1))));x.fillStyle='rgba(0,0,0,.35)';x.fillRect(0,0,W,H);mask('VOCÊ É A',W/2,760,110,WHT,t,2.15);mask('MATÉRIA-PRIMA.',W/2,900,150,'#FFE7B8',t,2.45);embers(t,.9);}
