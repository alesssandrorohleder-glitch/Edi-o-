{const es=new THREE.Scene();es.background=new THREE.Color(0x000000);

 const[gc,g]=mk(64,256);const q=g.createLinearGradient(0,0,0,256);[[0,'#ffffff'],[.3,'#dfe9ff'],[.46,'#5f86c8'],[.5,'#020409'],[.54,'#0c2f9e'],[.75,'#2f6dff'],[1,'#02050f']].forEach(([a,b])=>q.addColorStop(a,b));g.fillStyle=q;g.fillRect(0,0,64,256);
 const gt=new THREE.CanvasTexture(gc);gt.colorSpace=THREE.SRGBColorSpace;

  [[0,'#0a1638'],[.19,'#1b3f9c'],[.2,'#f6f9ff'],[.36,'#b9c9e6'],[.52,'#3f6fd8'],[.555,'#0b1c4a'],[.57,'#050a18'],[.6,'#6f86ad'],[.78,'#dfe8f6'],[.93,'#ffffff'],[1,'#ffffff']].forEach(([a,b])=>q.addColorStop(a,b));
  g.globalCompositeOperation='source-over';g.fillStyle=q;g.fillRect(0,0,1024,256);
  const u=fr(t/2.5),sx=lerp(-200,1224,u);g.save();g.transform(1,0,-.5,1,128,0);const b=g.createLinearGradient(sx-70,0,sx+70,0);b.addColorStop(0,'rgba(255,255,255,0)');b.addColorStop(.5,'rgba(255,255,255,.95)');b.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=b;g.fillRect(sx-70,0,140,256);const b2=g.createLinearGradient(sx-150,0,sx-110,0);b2.addColorStop(0,'rgba(170,210,255,0)');b2.addColorStop(.5,'rgba(170,210,255,.6)');b2.addColorStop(1,'rgba(170,210,255,0)');g.fillStyle=b2;g.fillRect(sx-150,0,40,256);g.restore();CHT_.needsUpdate=true;}

const M={face:SM({color:0xffffff,map:CHT_,emissive:0xffffff,emissiveMap:CHT_,emissiveIntensity:.62,metalness:.85,roughness:.2,envMapIntensity:.75}),side:SM({color:0x0d2f9c,metalness:1,roughness:.3,envMapIntensity:1.25}),
  cab:SM({color:0x07090d,metalness:.3,roughness:.55,envMapIntensity:.45}),rim:SM({color:0xd2dae8,metalness:1,roughness:.2,envMapIntensity:1.2}),
  rub:SM({color:0x040405,metalness:0,roughness:.8,envMapIntensity:.5}),cone:SM({color:0x2b3444,metalness:.55,roughness:.42,envMapIntensity:1.3,side:THREE.DoubleSide}),
  hole:new THREE.MeshBasicMaterial({color:0x000000}),wallm:SM({color:0x10141c,metalness:.8,roughness:.35,envMapIntensity:.9}),neon:new THREE.MeshBasicMaterial({color:0x1657ee}),

{const dl=new THREE.DirectionalLight(0xdfe8ff,1.3);dl.position.set(3,8,10);scene.add(dl);}

/* ---------- palco (construído 2×: real + espelhado no piso) ---------- */
const FY=-3.3,CWD=3.3,CHT=4.4,COLS=10,ROWSN=3,UPD=[];
const G={tor:(r,t)=>new THREE.TorusGeometry(r,t,12,56)};
function driverGeo(r){const pts=[];for(let i=0;i<=10;i++){const u=i/10;pts.push(new THREE.Vector2(lerp(r*.2,r*.8,u),-r*.36*(1-u)**1.5));}

  const wall=new THREE.CylinderGeometry(r*1.05,r*1.09,r*.4,56,1,true).rotateX(Math.PI/2).translate(0,0,-r*.2);
  return{r,cone,cap,wall,rim:G.tor(r,r*.07),sur:G.tor(r*.86,r*.085),led:G.tor(r*.945,r*.02),hole:new THREE.CircleGeometry(r*.82,40).translate(0,0,-r*.37)};}

    for(let r=0;r<ROWSN;r++){const cb=new THREE.Group();cb.position.set((q-(COLS-1)/2)*CWD,FY+CHT/2+r*CHT,-4.6);st.add(cb);
      cb.add(new THREE.Mesh(CABG,M.cab));const p=new THREE.Mesh(PORT,M.hole);p.position.set(0,-CHT/2+.33,.02);cb.add(p);const pr=new THREE.Mesh(PRIM,M.rim);pr.position.set(0,-CHT/2+.33,-.01);cb.add(pr);
      [[0,-.38,0],[0,1.45,1]].forEach(([dx,dy,k])=>{const d=DG[k],g=new THREE.Group();g.position.set(dx,dy,d.r*.4);cb.add(g);g.add(new THREE.Mesh(d.wall,M.wallm));
        g.add(new THREE.Mesh(d.hole,M.hole),new THREE.Mesh(d.rim,M.rim),new THREE.Mesh(d.sur,M.rub));const l=new THREE.Mesh(d.led,led);l.position.z=.05;g.add(l);
        const mv=new THREE.Group();mv.add(new THREE.Mesh(d.cone,M.cone),new THREE.Mesh(d.cap,M.rim));g.add(mv);
        UPD.push(t=>{const pu=k?kick(t-dl-.25)*.7:kick(t-dl-r*.02)*(fr((t-dl)/1)<.5?1:.7);mv.position.z=pu*d.r*.16;mv.scale.setScalar(1+pu*.03);});});}
    UPD.push(t=>{const pu=kick(t-dl);led.color.setRGB(.02+.35*pu,.10+.9*pu,.45+2.2*pu);});}
  // sombra suave atrás do nome (a parede continua viva nas laterais e em cima)
  {const[sc,sg]=mk(256,128),q=sg.createRadialGradient(128,64,6,128,64,128);q.addColorStop(0,'rgba(0,1,8,.80)');q.addColorStop(.55,'rgba(0,1,8,.55)');q.addColorStop(1,'rgba(0,1,8,0)');sg.fillStyle=q;sg.fillRect(0,0,256,128);
   const sp=new THREE.Mesh(new THREE.PlaneGeometry(40,13),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(sc),transparent:true,depthWrite:false,fog:false}));sp.position.set(0,FY+2.4,-2.2);st.add(sp);}
  // letreiro
  const s=3.7/700,tg=new THREE.Group();st.add(tg);let cx=0;const items=[];
  for(const ch of 'DJ ViNi'){if(ch==' '){cx+=250*s;continue;}const gl=GLY.g[ch],sp=new THREE.ShapePath();
    for(const[op,...a]of gl.cmd){if(op=='moveTo')sp.moveTo(a[0]*s,a[1]*s);else if(op=='lineTo')sp.lineTo(a[0]*s,a[1]*s);
      else if(op=='qCurveTo'){const P=[];for(let i=0;i<a.length;i+=2)P.push([a[i]*s,a[i+1]*s]);for(let i=0;i<P.length-1;i++){const e=i<P.length-2?[(P[i][0]+P[i+1][0])/2,(P[i][1]+P[i+1][1])/2]:P[i+1];sp.quadraticCurveTo(P[i][0],P[i][1],e[0],e[1]);}}}
    let shapes=sp.toShapes(false);const holes=shapes.reduce((n,h)=>n+h.holes.length,0);if((ch=='D'&&holes!=1)||(ch!='D'&&holes))shapes=sp.toShapes(true);
    const geo=new THREE.ExtrudeGeometry(shapes,{depth:.95,bevelEnabled:true,bevelThickness:.11,bevelSize:.075,bevelSegments:5,curveSegments:14});
    {const uv=geo.attributes.uv;for(let i=0;i<uv.count;i++)uv.setX(i,uv.getX(i)+cx+1);}geo.computeBoundingBox();const bb=geo.boundingBox,mx=(bb.min.x+bb.max.x)/2;geo.translate(-mx,0,-.5);

    let dot=null;if(ch=='i'){let best=null;for(const sh of shapes){const b=new THREE.Box2().setFromPoints(sh.getPoints());if(!best||b.min.y>best.min.y)best=b;}dot=new THREE.Vector3((best.min.x+best.max.x)/2-mx,(best.min.y+best.max.y)/2,.62);}
    items.push({lg,dot});cx+=gl.adv*s+.06;}
  const TW=cx;tg.position.set(-TW/2-.25,FY+.42,0);
  items.forEach((it,i)=>UPD.push(t=>{const h=hopAt(t,i);it.lg.position.z=h*.9;it.lg.position.y=h*.16;it.lg.rotation.x=-h*.13;it.lg.rotation.y=Math.sin(TAU*t/5+i*.55)*.085;it.lg.scale.setScalar(1+h*.035+kick(t)*.008);}));
  // base cromada com filete de luz
  const pl=new THREE.Mesh(new THREE.BoxGeometry(TW+2.2,.34,2.3),M.plinth);pl.position.set(0,FY+.17,.1);st.add(pl);
  const ls=new THREE.Mesh(new THREE.BoxGeometry(TW+2.24,.07,2.34),new THREE.MeshBasicMaterial({color:0x2f8cff}));ls.position.set(0,FY+.17,.1);st.add(ls);
  UPD.push(t=>ls.material.color.setRGB(.1+.5*kick(t),.35+1.2*kick(t),1.2+2.4*kick(t)));

const floor=new THREE.Mesh(new THREE.PlaneGeometry(120,60),SM({color:0x01030a,metalness:.7,roughness:.3,transparent:true,opacity:.60,envMapIntensity:.5}));floor.rotation.x=-Math.PI/2;floor.position.set(0,FY,6);scene.add(floor);
// feixes de luz de palco
const[bmc,bmg]=mk(32,256);{const q=bmg.createLinearGradient(0,0,0,256);q.addColorStop(0,'rgba(255,255,255,.95)');q.addColorStop(.25,'rgba(255,255,255,.35)');q.addColorStop(1,'rgba(255,255,255,0)');bmg.fillStyle=q;bmg.fillRect(0,0,32,256);}
const bmt=new THREE.CanvasTexture(bmc),BEAMS=[];
for(let i=0;i<8;i++){const g=new THREE.ConeGeometry(1.7,17,28,1,true).translate(0,-8.5,0),m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({map:bmt,color:i%2?0x2f6dff:0xbfd4ff,transparent:true,opacity:.2,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide,fog:false}));
  m.position.set((i-3.5)*3.5,10.5,-3.4);scene.add(m);BEAMS.push(m);}

const[spc,spg]=mk(64,64);{const q=spg.createRadialGradient(32,32,0,32,32,32);q.addColorStop(0,'rgba(255,255,255,1)');q.addColorStop(.3,'rgba(150,200,255,.5)');q.addColorStop(1,'rgba(40,110,255,0)');spg.fillStyle=q;spg.fillRect(0,0,64,64);}
const pts=new THREE.Points(pg,new THREE.PointsMaterial({map:new THREE.CanvasTexture(spc),size:.16,transparent:true,opacity:.8,blending:THREE.AdditiveBlending,depthWrite:false,color:0xbfd8ff}));scene.add(pts);

/* ---------- pós em 2D ---------- */
const spot=(()=>{const[k,g]=mk(512,512),q=g.createRadialGradient(256,256,0,256,256,256);q.addColorStop(0,'rgba(255,255,255,1)');q.addColorStop(.18,'rgba(160,205,255,.55)');q.addColorStop(.5,'rgba(50,120,255,.14)');q.addColorStop(1,'rgba(0,60,255,0)');g.fillStyle=q;g.fillRect(0,0,512,512);return k;})();
function star(g,X,Y,r,a,rot=0){if(a<=0)return;g.save();g.translate(X,Y);g.rotate(rot);g.globalAlpha=a;g.globalCompositeOperation='lighter';
  g.drawImage(spot,-r*.9,-r*.9,r*1.8,r*1.8);g.fillStyle='#fff';for(let k=0;k<2;k++){g.rotate(Math.PI/2*k);g.beginPath();g.moveTo(-r,0);g.quadraticCurveTo(0,-r*.06,r,0);g.quadraticCurveTo(0,r*.06,-r,0);g.fill();}
  g.rotate(Math.PI/4);g.globalAlpha=a*.5;for(let k=0;k<2;k++){g.rotate(Math.PI/2*k);g.beginPath();g.moveTo(-r*.45,0);g.quadraticCurveTo(0,-r*.045,r*.45,0);g.quadraticCurveTo(0,r*.045,-r*.45,0);g.fill();}g.restore();}
function rr(g,X,Y,w,h,r){g.beginPath();g.moveTo(X+r,Y);g.arcTo(X+w,Y,X+w,Y+h,r);g.arcTo(X+w,Y+h,X,Y+h,r);g.arcTo(X,Y+h,X,Y,r);g.arcTo(X,Y,X+w,Y,r);g.closePath();}
const BM=58,BR=74,BW=42,bx=BM,by=BM,bw=W-BM*2,bh=H-BM*2;
const SEG=[bw-2*BR,Math.PI/2*BR,bh-2*BR,Math.PI/2*BR,bw-2*BR,Math.PI/2*BR,bh-2*BR,Math.PI/2*BR],PER=SEG.reduce((a,b)=>a+b,0);
function per(u){let d=fr(u)*PER;const q=(cx,cy,a0,dd)=>{const a=a0+dd/BR;return[cx+Math.cos(a)*BR,cy+Math.sin(a)*BR];};
  if(d<SEG[0])return[bx+BR+d,by];d-=SEG[0];if(d<SEG[1])return q(bx+bw-BR,by+BR,-Math.PI/2,d);d-=SEG[1];

const[BORD,bd]=mk(W,H);
{bd.shadowColor='#1450ff';bd.shadowBlur=26;rr(bd,bx,by,bw,bh,BR);bd.lineWidth=BW;bd.strokeStyle='#0a1f6e';bd.stroke();bd.shadowBlur=0;
 const q=bd.createLinearGradient(0,0,W,H);[[0,'#0e33a8'],[.25,'#081c62'],[.5,'#1644c8'],[.75,'#081c62'],[1,'#0e33a8']].forEach(([a,b])=>q.addColorStop(a,b));bd.strokeStyle=q;bd.lineWidth=BW;bd.stroke();
 rr(bd,bx-BW/2+3,by-BW/2+3,bw+BW-6,bh+BW-6,BR+BW/2);bd.lineWidth=4;bd.strokeStyle='rgba(120,170,255,.55)';bd.stroke();
 rr(bd,bx+BW/2-3,by+BW/2-3,bw-BW+6,bh-BW+6,BR-BW/2);bd.lineWidth=4;bd.strokeStyle='rgba(60,110,255,.6)';bd.stroke();
 rr(bd,bx,by,bw,bh,BR);bd.lineWidth=5;bd.strokeStyle='rgba(150,195,255,.35)';bd.stroke();}
const[BL,bl]=mk(W/8,H/8),[VG,vg]=mk(W/4,H/4);

const v3=new THREE.Vector3();

window.DUR=10;
window.draw=function(t){t=fr(t/10)*10;
  for(const f of UPD)f(t);
  const a=TAU*t/10;cam.position.set(Math.sin(a)*2.1,-1.35+Math.sin(a*2)*.22,20.6-Math.cos(a)*.7);cam.lookAt(Math.sin(a)*.25,-.95,0);

  x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;x.globalCompositeOperation='source-over';x.filter='none';x.imageSmoothingQuality='high';x.drawImage(glc,0,0,W,H);

  x.globalAlpha=.88+.12*kick(t);x.drawImage(BORD,0,0);x.globalAlpha=1;x.globalCompositeOperation='lighter';
  for(let k=0;k<3;k++){const u0=k/3+2*t/10;for(let j=110;j>=0;j--){const[px,py]=per(u0-j*.0009),al=(1-j/110)**2,s=20+al*30;x.globalAlpha=al*.32;x.drawImage(spot,px-s,py-s,s*2,s*2);}
