<body><canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
/* 25 — FREAKNC · anúncio de festa na estética do @freaknclabel (roxo + amarelo + preto, retícula duotone,
   nome repetido em pilha, letra psicodélica distorcida, nome em arco, janela XP, código de barras, texto justificado).
   Artistas ilustrados em retícula (trocar pelas fotos reais). Cena nova a cada 2s, 120bpm, 32s. */
for(const f of ['50px Anton','50px Bowlby','900 50px Archivo','500 50px Archivo','700 50px Fredoka'])await document.fonts.load(f);
const W=1080,H=1920,c=document.getElementById('c'),X0=c.getContext('2d');let x=X0;
const PUR='#9B2FE0',PUR2='#814A88',YEL='#F4C22B',BLK='#111112',GRY='#2B2B2D',WHT='#F3F0EA';
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),p=(t,a,b)=>cl((t-a)/(b-a)),lerp=(a,b,k)=>a+(b-a)*k;
const eo=t=>1-Math.pow(1-t,3),eo5=t=>1-Math.pow(1-t,5),eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,ei=t=>t*t*t;
const spr=t=>t<=0?0:1-Math.exp(-8*t)*Math.cos(12*t);const rnd=s=>{const r=Math.sin(s*127.1+311.7)*43758.5453;return r-Math.floor(r)};
const BT=.5,kick=t=>Math.exp(-(t%BT)*7),bob=t=>Math.sin((t%BT)/BT*Math.PI)**2;
function T(s,X,Y,size,col,{f='Anton',w='',ls=0,al='center',a=1,base='middle',stroke=0,sc=1}={}){if(a<=0)return;x.save();x.globalAlpha*=a;x.translate(X,Y);x.scale(1,sc);x.font=`${w} ${size}px ${f}`;x.letterSpacing=ls+'px';x.textAlign=al;x.textBaseline=base;
  if(stroke){x.lineJoin='round';x.strokeStyle=stroke[0];x.lineWidth=stroke[1];x.strokeText(s,0,0);}x.fillStyle=col;x.fillText(s,0,0);x.restore();}
function tw(s,size,f='Anton',w='',ls=0){x.save();x.font=`${w} ${size}px ${f}`;x.letterSpacing=ls+'px';const m=x.measureText(s).width;x.restore();return m;}
const fit=(s,wid,max=900,f='Anton')=>Math.min(max,wid/tw(s,100,f)*100);
function rr(X,Y,w,h,r){x.beginPath();x.roundRect(X,Y,w,h,r);}
function mask(s,X,Y,size,col,t,t0,o={}){const k=eo5(p(t,t0,t0+(o.dur??.35)));if(k<=0)return;x.save();x.beginPath();x.rect(0,Y-size*.9,W,size*1.6);x.clip();T(s,X+(o.from?(1-k)*o.from*W:0),Y+(o.from?0:(1-k)*size*1.3),size,col,o);x.restore();}

/* ---------------- textura: retícula, grão, papel ---------------- */
const NZ=document.createElement('canvas');NZ.width=NZ.height=256;{const g=NZ.getContext('2d'),d=g.createImageData(256,256);for(let i=0;i<d.data.length;i+=4){const v=128+(rnd(i*.37)-.5)*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}g.putImageData(d,0,0);}
const DOT=document.createElement('canvas');DOT.width=DOT.height=12;{const g=DOT.getContext('2d');g.fillStyle='#000';g.beginPath();g.arc(6,6,2.4,0,7);g.fill();}

// figura em retícula: desenha em tons de cinza → converte em pontos (duotone) — cacheado
function halftone(w,h,draw,ink,base,cell=10){const A=document.createElement('canvas');A.width=w;A.height=h;const a=A.getContext('2d');draw(a);const d=a.getImageData(0,0,w,h).data;
  const B=document.createElement('canvas');B.width=w;B.height=h;const b=B.getContext('2d');b.drawImage(A,0,0);b.globalCompositeOperation='source-in';b.fillStyle=base;b.fillRect(0,0,w,h);b.globalCompositeOperation='source-over';b.fillStyle=ink;
  for(let y=0;y<h;y+=cell)for(let X=0;X<w;X+=cell){const i=((y+cell/2|0)*w+(X+cell/2|0))*4;if(d[i+3]<40)continue;const L=(d[i]*.3+d[i+1]*.59+d[i+2]*.11)/255;const r=(1-L)*cell*.62;if(r>.4){b.beginPath();b.arc(X+cell/2+((y/cell)%2)*cell/2,y+cell/2,r,0,7);b.fill();}}
  return B;}
// DJ ilustrado (cinza, luz de cima/esquerda) — estilos: cap, fone, óculos, cabelo
function djFig(style){return g=>{const sh=(cx,cy,r0,r1,c0,c1)=>{const q=g.createRadialGradient(cx,cy,r0,cx,cy,r1);q.addColorStop(0,c0);q.addColorStop(1,c1);return q;};

  g.fillStyle=sh(260,560,40,520,'#d0d0d0','#161616');g.beginPath();g.moveTo(40,1000);g.bezierCurveTo(50,720,120,600,250,560);g.quadraticCurveTo(350,535,450,560);g.bezierCurveTo(580,600,650,720,660,1000);g.closePath();g.fill();
  g.fillStyle=sh(330,450,10,140,'#bdbdbd','#3a3a3a');g.beginPath();g.moveTo(295,420);g.lineTo(405,420);g.lineTo(420,575);g.quadraticCurveTo(350,600,280,575);g.closePath();g.fill();
  // cabeça com mandíbula
  g.fillStyle=sh(300,250,20,230,'#f2f2f2','#3a3a3a');g.beginPath();g.moveTo(350,120);g.bezierCurveTo(470,120,500,230,490,320);g.bezierCurveTo(480,420,420,480,350,485);g.bezierCurveTo(280,480,220,420,210,320);g.bezierCurveTo(200,230,230,120,350,120);g.fill();
  g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(395,330,60,110,.1,0,7);g.fill();   // sombra lateral do rosto
  g.fillStyle='#1c1c1c';

  if(style==='long'){g.beginPath();g.moveTo(350,95);g.bezierCurveTo(560,95,560,420,540,640);g.lineTo(460,640);g.bezierCurveTo(490,420,480,230,350,200);g.bezierCurveTo(220,230,210,420,240,640);g.lineTo(160,640);g.bezierCurveTo(140,420,140,95,350,95);g.fill();}
  if(style==='buzz'){g.fillStyle='#4a4a4a';g.beginPath();g.moveTo(212,270);g.bezierCurveTo(215,120,485,120,488,270);g.bezierCurveTo(430,200,270,200,212,270);g.fill();}
  if(style!=='long'){g.strokeStyle='#141414';g.lineWidth=30;g.beginPath();g.arc(350,310,170,Math.PI*1.1,-.1);g.stroke();g.fillStyle='#141414';g.beginPath();g.ellipse(190,330,48,78,.08,0,7);g.ellipse(510,330,48,78,-.08,0,7);g.fill();
    g.fillStyle='#555';g.beginPath();g.ellipse(180,320,18,40,.08,0,7);g.fill();}
  else{g.strokeStyle='#141414';g.lineWidth=22;g.beginPath();g.moveTo(185,380);g.quadraticCurveTo(170,520,290,560);g.stroke();}
  // mesa / CDJs em primeiro plano
  g.fillStyle=sh(350,880,40,520,'#7a7a7a','#050505');g.fillRect(0,860,700,140);g.fillStyle='#9a9a9a';g.fillRect(0,860,700,8);
  g.fillStyle=sh(170,920,4,80,'#cfcfcf','#2a2a2a');g.beginPath();g.arc(170,930,70,0,7);g.fill();g.fillStyle=sh(530,920,4,80,'#cfcfcf','#2a2a2a');g.beginPath();g.arc(530,930,70,0,7);g.fill();};}
function rr2(g,X,Y,w,h,r){g.beginPath();g.roundRect(X,Y,w,h,r);g.fill();}
const FIG={};[['cap',BLK,YEL],['hair',BLK,PUR],['long',BLK,YEL],['buzz',BLK,PUR],['cap2',BLK,PUR],['hair2',BLK,YEL]].forEach(([s,i,b])=>FIG[s]=halftone(700,1000,djFig(s.replace('2','')),i,b,8));
const CROWD=halftone(1080,700,g=>{for(let i=0;i<14;i++){const X=40+i*78+rnd(i)*30,Y=360+rnd(i+4)*120,c=Math.floor(40+rnd(i+7)*80);g.fillStyle=`rgb(${c},${c},${c})`;g.beginPath();g.ellipse(X,Y,48,58,0,0,7);g.fill();g.fillRect(X-60,Y+50,120,400);
  if(i%2){g.save();g.translate(X+30,Y+60);g.rotate(-.35+rnd(i)*.3);g.fillRect(-14,-300,28,300);g.beginPath();g.arc(0,-300,24,0,7);g.fill();g.restore();}}},PUR,YEL,9);

/* ---------------- elementos da marca ---------------- */
const LOGOM=await new Promise(r=>{const im=new Image();im.onload=()=>r(im);im.src='logo_freaknc_mask.png';});const LOGOC={};
function logo(X,Y,size,col,a=1){if(!LOGOC[col]){const C=document.createElement('canvas');C.width=LOGOM.width;C.height=LOGOM.height;const g=C.getContext('2d');g.drawImage(LOGOM,0,0);g.globalCompositeOperation='source-in';g.fillStyle=col;g.fillRect(0,0,C.width,C.height);LOGOC[col]=C;}
  const w=size*2.6,h=w*LOGOM.height/LOGOM.width;x.save();x.globalAlpha*=a;x.drawImage(LOGOC[col],X-w/2,Y-h/2,w,h);x.restore();}
function barcode(X,Y,w,h,col=BLK,label='freaknc · your underground label'){x.save();x.fillStyle=WHT;x.fillRect(X-8,Y-8,w+16,h+60);x.fillStyle=col;let cx=X;for(let i=0;cx<X+w;i++){const bw=1+Math.floor(rnd(i+3)*4)*1.5;if(i%2===0)x.fillRect(cx,Y,bw,h);cx+=bw+1;}
  T(label,X+w/2,Y+h+28,26,col,{f:'Archivo',w:800});x.restore();}
function warpText(s,X,Y,size,fill,outline,t,amp=24,freq=.012,font='Bowlby'){ // letra psicodélica (fatias com seno)
  const C=warpText.C||(warpText.C=document.createElement('canvas'));C.width=W;C.height=Math.ceil(size*1.6);const g=C.getContext('2d');g.font=`${size}px ${font}`;g.textAlign='center';g.textBaseline='middle';

  for(let sx=0;sx<W;sx+=6){const dy=Math.sin(sx*freq+t*3)*amp,sc=1+.18*Math.sin(sx*freq*.7-t*2);x.drawImage(C,sx,0,6,C.height,X-W/2+sx,Y-C.height/2*sc+dy,6,C.height*sc);}}
function arcText(s,X,Y,r,size,col,top=true,rot=0){x.save();x.translate(X,Y);x.rotate(rot);x.font=`${size}px Anton`;x.textAlign='center';x.textBaseline='middle';x.fillStyle=col;const ch=s.split(''),ws=ch.map(c=>x.measureText(c).width),tot=ws.reduce((a,b)=>a+b,0)*1.02,span=tot/r;
  let a=-span/2;ch.forEach((c,i)=>{const m=a+ws[i]/r/2;x.save();if(top){x.rotate(m);x.translate(0,-r);}else{x.rotate(-m);x.translate(0,r);x.rotate(Math.PI);x.scale(-1,-1);x.scale(-1,-1);x.rotate(Math.PI);}x.fillText(c,0,0);x.restore();a+=ws[i]/r*1.02;});x.restore();}
function corners(col,a=1){x.save();x.globalAlpha=a;T('2026',70,1640,40,col,{f:'Archivo',w:800,al:'left'});T('2026',W-70,1640,40,col,{f:'Archivo',w:800,al:'right'});x.fillStyle=col;x.fillRect(70,1600,W-140,3);T('YOUR UNDERGROUND LABEL',W/2,1640,36,col,{f:'Archivo',w:800});x.restore();}

/* ---------------- colagem impressa: stop-motion, fita, marcador, papel ---------------- */
const SM=t=>Math.floor(t*12);const jit=(t,seed,amp)=>(rnd(SM(t)*1.7+seed)-.5)*amp;  // tremida de stop-motion (12 qps)
function hold(t,fn){x.save();x.translate(jit(t,1,8),jit(t,2,8));x.rotate(jit(t,3,.012));fn();x.restore();}
function tape(X,Y,w,ang,col='rgba(236,226,196,.82)'){x.save();x.translate(X,Y);x.rotate(ang);x.fillStyle=col;x.beginPath();x.moveTo(-w/2,-30);for(let i=0;i<=6;i++)x.lineTo(w/2+(i%2?8:0),-30+i*10);for(let i=0;i<=6;i++)x.lineTo(-w/2-(i%2?8:0),30-i*10);x.closePath();x.fill();
  x.globalAlpha=.25;x.fillStyle='#fff';x.fillRect(-w/2,-30,w,12);x.restore();}
function scribble(X,Y,rx,ry,k,col=YEL,lw=12,seed=1){if(k<=0)return;x.save();x.strokeStyle=col;x.lineWidth=lw;x.lineCap='round';x.lineJoin='round';x.beginPath();const N=90,turns=1.15;
  for(let i=0;i<=N*k;i++){const u=i/N,a=-1.9+u*Math.PI*2*turns,w=1+.06*Math.sin(u*17+seed)+.04*(u-.5);const px=X+Math.cos(a)*rx*w,py=Y+Math.sin(a)*ry*w;i?x.lineTo(px,py):x.moveTo(px,py);}x.stroke();x.restore();}
function arrowS(X0,Y0,X1,Y1,k,col=YEL,lw=12){if(k<=0)return;x.save();x.strokeStyle=col;x.lineWidth=lw;x.lineCap='round';const mx=(X0+X1)/2+(Y1-Y0)*.25,my=(Y0+Y1)/2-(X1-X0)*.25;x.beginPath();
  for(let i=0;i<=40*k;i++){const u=i/40,px=(1-u)**2*X0+2*(1-u)*u*mx+u*u*X1,py=(1-u)**2*Y0+2*(1-u)*u*my+u*u*Y1;i?x.lineTo(px,py):x.moveTo(px,py);}x.stroke();
  if(k>=1){const an=Math.atan2(Y1-my,X1-mx);x.beginPath();x.moveTo(X1,Y1);x.lineTo(X1-Math.cos(an-.5)*50,Y1-Math.sin(an-.5)*50);x.moveTo(X1,Y1);x.lineTo(X1-Math.cos(an+.5)*50,Y1-Math.sin(an+.5)*50);x.stroke();}x.restore();}
function highlight(X,Y,w,h,k,col='rgba(244,194,43,.85)'){if(k<=0)return;x.save();x.fillStyle=col;x.beginPath();x.moveTo(X,Y-h/2+4);x.lineTo(X+w*k,Y-h/2);x.lineTo(X+w*k+6,Y+h/2);x.lineTo(X-4,Y+h/2+3);x.closePath();x.fill();x.restore();}
function sticker(t,X,Y,r,txt,bg,fg,k,rot=0){if(k<=0)return;x.save();x.translate(X,Y);x.rotate(rot+jit(t,X,.05));x.scale(k,k);x.fillStyle='#fff';x.beginPath();for(let i=0;i<24;i++){const a=i/24*Math.PI*2,rr_=i%2?r*.86:r+8;x.lineTo(Math.cos(a)*rr_,Math.sin(a)*rr_);}x.closePath();x.fill();
  x.fillStyle=bg;x.beginPath();for(let i=0;i<24;i++){const a=i/24*Math.PI*2,rr_=i%2?r*.8:r;x.lineTo(Math.cos(a)*rr_,Math.sin(a)*rr_);}x.closePath();x.fill();T(txt,0,6,r*.62,fg);x.restore();}
function cursor(X,Y,click){x.save();x.translate(X,Y);x.fillStyle='#fff';x.strokeStyle='#000';x.lineWidth=4;x.beginPath();x.moveTo(0,0);x.lineTo(0,70);x.lineTo(18,54);x.lineTo(30,82);x.lineTo(42,76);x.lineTo(30,50);x.lineTo(52,50);x.closePath();x.fill();x.stroke();
  if(click>0&&click<1){x.strokeStyle=YEL;x.lineWidth=5;x.globalAlpha=1-click;x.beginPath();x.arc(0,0,20+click*60,0,7);x.stroke();}x.restore();}
const PAPER=document.createElement('canvas');PAPER.width=540;PAPER.height=960;{const g=PAPER.getContext('2d');g.fillStyle='#808080';g.fillRect(0,0,540,960);const d=g.getImageData(0,0,540,960);for(let i=0;i<d.data.length;i+=4){const v=128+(rnd(i*.11)-.5)*36;d.data[i]=d.data[i+1]=d.data[i+2]=v;}g.putImageData(d,0,0);
  g.globalAlpha=.25;for(let i=0;i<500;i++){g.strokeStyle=rnd(i)>.5?'#fff':'#333';g.lineWidth=.6;g.beginPath();const X=rnd(i+1)*540,Y=rnd(i+2)*960,a=rnd(i+3)*7;g.moveTo(X,Y);g.lineTo(X+Math.cos(a)*14,Y+Math.sin(a)*14);g.stroke();}}
function torn(e,edgeSeed=1){const pts=[];const X=lerp(-80,W+80,e);for(let i=0;i<=40;i++){const y=i*H/40;pts.push([X+(rnd(i*3.1+edgeSeed)-.5)*70+Math.sin(i*.8)*20,y]);}return pts;}

/* ---------------- cenas (2s cada) ---------------- */
const HK=[['BUILT',BLK,PUR],['FOR THE',PUR,YEL],['DANCE',YEL,BLK],['FLOOR',BLK,YEL]];
function hook(t){const i=Math.min(3,Math.floor(t/BT)),lt=t-i*BT,[w,bg,fg]=HK[i];x.fillStyle=bg;x.fillRect(0,0,W,H);dots(.1);const s=fit(w,980,900),sc=1.15-.15*eo5(p(lt,0,.2));
  hold(t,()=>{x.save();x.translate(W/2,960);x.scale(sc,sc*lerp(1.6,1.25,eo5(p(lt,0,.25))));T(w,0,0,s,fg);x.restore();});tape(160,420,220,-.5);tape(W-170,1500,240,.4);}

  logo(W/2,860,190*cl(k,0,1.2),PUR2,cl(k*2));mask('PRESENTS:',W/2,1330,110,WHT,t,2.5,{ls:6});scribble(W/2,1330,330,95,eo(p(lt,.8,1.4)),YEL,10,3);sticker(t,860,560,110,'2026',PUR,YEL,spr(lt-1.1),.2);mask('YOUR UNDERGROUND LABEL',W/2,1450,48,YEL,t,2.8,{f:'Archivo',w:900});dots(.08);}

  sticker(t,820,1260,150,'#01',BLK,YEL,spr(lt-.7),-.15);tape(260,560,260,-.35);arrowS(560,1450,760,1330,eo(p(lt,1.0,1.4)),BLK,10);mask('A NOITE MAIS FREAK DO ANO',W/2,1460,56,BLK,t,4.9,{f:'Archivo',w:900});}
function dateS(t){const lt=t-6;x.fillStyle=BLK;x.fillRect(0,0,W,H);const s=fit('13.12',980,700);mask('13.12',W/2,720,s,YEL,t,6.05,{sc:1.2});scribble(W/2,740,520,300,eo(p(lt,.5,1.1)),PUR,14,5);
  const L=['SÁBADO','23H','ATÉ','08H'];L.forEach((w,i)=>{const X=[180,440,640,880][i];T(w,X,1130,90,i%2?PUR:WHT,{a:eo(p(lt,.4+i*.1,.7+i*.1))});});
  x.save();x.translate(lerp(W,0,eo5(p(lt,.6,1.1))),0);barcode(300,1300,480,120);x.restore();}
function stack(t,t0,name,fig){const lt=t-t0;x.fillStyle=YEL;x.fillRect(0,0,W,H);logo(150,330,64,PUR2);T('PRESENTS:',W-90,330,52,BLK,{al:'right'});const s=fit(name,980,520);
