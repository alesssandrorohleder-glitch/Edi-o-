<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      :root {
        --accent: #ffd60a;
        --ink: #0d0d0d;
        --paper: #ffffff;
        --font-head: "League Gothic", "Oswald", sans-serif;
        --font-chip: "Archivo Black", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { width: 100%; height: 100%; position: relative; overflow: hidden; }
      #cam { position: absolute; inset: 0; transform-origin: 50% 55%; }
      #base { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #topfade {
        position: absolute; left: 0; right: 0; top: 0; height: 560px;
        background: linear-gradient(to bottom, rgba(0, 0, 0, 0.42), rgba(0, 0, 0, 0) 100%);
      }
      #flash { position: absolute; inset: 0; background: #fff; opacity: 0; }

      /* headline blocks live in the top band, above the action */
      .cap { position: absolute; left: 0; right: 0; top: 190px; text-align: center; }
      .head {
        font-family: var(--font-head); text-transform: uppercase; color: var(--paper);
        font-size: 190px; line-height: 0.86; letter-spacing: 0.01em;
        text-shadow: 0 6px 0 rgba(0, 0, 0, 0.35), 0 10px 40px rgba(0, 0, 0, 0.45);
      }
      .head .y { color: var(--accent); }
      .chip {
        display: inline-block; padding: 14px 30px 12px; border-radius: 16px;
        background: var(--accent); color: var(--ink);
        font-family: var(--font-chip); font-size: 46px; text-transform: uppercase; letter-spacing: 0.01em;
        box-shadow: 0 10px 0 rgba(0, 0, 0, 0.25);
      }
      .chip.dark { background: var(--ink); color: var(--paper); }
      .line { display: block; }
      .sub {
        margin-top: 22px; display: inline-block;
        font-family: var(--font-chip); font-size: 42px; color: var(--paper); text-transform: uppercase;
        text-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
      }
      .mid { font-size: 150px; margin-top: 18px; }
      .hk { font-size: 160px; }
      .sub.box { background: rgba(13, 13, 13, 0.82); padding: 12px 24px 10px; border-radius: 14px; text-shadow: none; }

      /* split labels */
      .half { position: absolute; top: 210px; width: 540px; text-align: center; }
      #lbl-antes { left: 0; }
      #lbl-depois { left: 540px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="58.95" data-width="1080" data-height="1920">
      <div id="cam">
        <video id="base" class="clip" src="assets/base.mp4" data-has-audio="true" data-volume="0.5" playsinline data-start="0" data-duration="58.95" data-track-index="0"></video>
      </div>
      <div id="topfade"></div>

      <!-- HOOK -->
      <div id="t-hook" class="cap clip" data-start="0" data-duration="2.75" data-track-index="1">
        <div class="head hk"><span class="w1">tchau,</span> <span class="y w2">barba.</span></div>
      </div>

      <!-- BEATS -->
      <div id="t-first" class="cap clip" data-start="2.85" data-duration="2.2" data-track-index="1">
        <span class="chip">1ª passada</span><br /><span class="sub">sem volta agora</span>
      </div>
      <div id="t-smile" class="cap clip" data-start="11.85" data-duration="2.3" data-track-index="1">
        <span class="chip dark">tá ficando bom?</span>
      </div>
      <div id="t-sides" class="cap clip" data-start="15.75" data-duration="2.2" data-track-index="1">
        <span class="chip">agora as laterais</span>
      </div>
      <div id="t-half" class="cap clip" data-start="27.75" data-duration="1.6" data-track-index="1">
        <span class="chip dark">metade do caminho</span>
      </div>
      <div id="t-drama" class="cap clip" data-start="29.45" data-duration="1.5" data-track-index="1">
        <div class="head mid">drama? <span class="y">sim.</span></div>
      </div>
      <div id="t-neck" class="cap clip" data-start="36.55" data-duration="2.2" data-track-index="1">
        <span class="chip">agora o pescoço</span>
      </div>
      <div id="t-check" class="cap clip" data-start="44.55" data-duration="1.4" data-track-index="1">
        <span class="chip dark">conferindo...</span>
      </div>

      <!-- REVEAL -->
      <div id="t-reveal" class="cap clip" data-start="46" data-duration="2.15" data-track-index="1">
        <div class="head"><span class="y">depois.</span></div>
      </div>
      <div id="lbl-antes" class="half clip" data-start="48.2" data-duration="2.55" data-track-index="2">
        <span class="chip dark">antes</span>
      </div>
      <div id="lbl-depois" class="half clip" data-start="48.2" data-duration="2.55" data-track-index="3">
        <span class="chip">depois</span>
      </div>
      <div id="t-who" class="cap clip" data-start="50.85" data-duration="4.9" data-track-index="1">
        <div class="head mid">quem é <span class="y">esse?</span></div>
      </div>

      <!-- END -->
      <div id="t-end" class="cap clip" data-start="55.85" data-duration="3.1" data-track-index="1">
        <div class="head mid">o <span class="y">saldo</span></div>
        <span class="sub box">barba ou sem barba? comenta</span>
      </div>

      <div id="flash" class="clip" data-start="45.9" data-duration="0.7" data-track-index="4"></div>

      <!-- SOUND DESIGN -->
      <audio id="s-hook" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="0.02" data-duration="2.1" data-volume="0.45" data-track-index="10"></audio>
      <audio id="s-w1" class="clip" src="assets/sfx/whoosh.mp3" data-start="1.3" data-duration="0.57" data-volume="0.55" data-track-index="11"></audio>
      <audio id="s-first" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="2.8" data-duration="2.1" data-volume="0.5" data-track-index="12"></audio>
      <audio id="s-p1" class="clip" src="assets/sfx/pop.mp3" data-start="2.9" data-duration="0.72" data-volume="0.55" data-track-index="13"></audio>
      <audio id="s-c1" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="6.15" data-duration="0.57" data-volume="0.3" data-track-index="11"></audio>
      <audio id="s-c2" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="10.15" data-duration="0.57" data-volume="0.3" data-track-index="11"></audio>
      <audio id="s-w2" class="clip" src="assets/sfx/whoosh.mp3" data-start="11.65" data-duration="0.57" data-volume="0.5" data-track-index="11"></audio>
      <audio id="s-p2" class="clip" src="assets/sfx/pop.mp3" data-start="11.9" data-duration="0.72" data-volume="0.55" data-track-index="13"></audio>
      <audio id="s-w3" class="clip" src="assets/sfx/whoosh.mp3" data-start="14.05" data-duration="0.57" data-volume="0.5" data-track-index="11"></audio>
      <audio id="s-p3" class="clip" src="assets/sfx/pop.mp3" data-start="15.8" data-duration="0.72" data-volume="0.55" data-track-index="13"></audio>
      <audio id="s-c3" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="19.05" data-duration="0.57" data-volume="0.3" data-track-index="11"></audio>
      <audio id="s-c4" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="23.55" data-duration="0.57" data-volume="0.3" data-track-index="11"></audio>
      <audio id="s-w4" class="clip" src="assets/sfx/whoosh.mp3" data-start="27.55" data-duration="0.57" data-volume="0.5" data-track-index="11"></audio>
      <audio id="s-p4" class="clip" src="assets/sfx/pop.mp3" data-start="27.8" data-duration="0.72" data-volume="0.55" data-track-index="13"></audio>
      <audio id="s-glitch" class="clip" src="assets/sfx/glitch-1.mp3" data-start="29.38" data-duration="1.5" data-volume="0.35" data-track-index="12"></audio>
      <audio id="s-w5" class="clip" src="assets/sfx/whoosh.mp3" data-start="30.85" data-duration="0.57" data-volume="0.5" data-track-index="11"></audio>
      <audio id="s-c5" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="34.35" data-duration="0.57" data-volume="0.3" data-track-index="11"></audio>
      <audio id="s-w6" class="clip" src="assets/sfx/whoosh.mp3" data-start="36.35" data-duration="0.57" data-volume="0.5" data-track-index="11"></audio>
      <audio id="s-p5" class="clip" src="assets/sfx/pop.mp3" data-start="36.6" data-duration="0.72" data-volume="0.55" data-track-index="13"></audio>
      <audio id="s-c6" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="40.35" data-duration="0.57" data-volume="0.3" data-track-index="11"></audio>
      <audio id="s-riser" class="clip" src="assets/sfx/riser.mp3" data-start="41.9" data-duration="4.15" data-volume="0.4" data-track-index="14"></audio>
      <audio id="s-p6" class="clip" src="assets/sfx/click-soft.mp3" data-start="44.6" data-duration="0.37" data-volume="0.6" data-track-index="13"></audio>
      <audio id="s-reveal" class="clip" src="assets/sfx/impact-bass-2.mp3" data-start="46" data-duration="2.2" data-volume="0.55" data-track-index="12"></audio>
      <audio id="s-spark" class="clip" src="assets/sfx/sparkle.mp3" data-start="46.1" data-duration="1.8" data-volume="0.45" data-track-index="13"></audio>
      <audio id="s-split" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="45.9" data-duration="3.3" data-volume="0.35" data-track-index="15"></audio>
      <audio id="s-p7" class="clip" src="assets/sfx/pop.mp3" data-start="48.25" data-duration="0.72" data-volume="0.5" data-track-index="13"></audio>
      <audio id="s-w7" class="clip" src="assets/sfx/whoosh.mp3" data-start="50.6" data-duration="0.57" data-volume="0.5" data-track-index="11"></audio>
      <audio id="s-w8" class="clip" src="assets/sfx/whoosh.mp3" data-start="55.6" data-duration="0.57" data-volume="0.55" data-track-index="11"></audio>
      <audio id="s-end" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="55.85" data-duration="2.1" data-volume="0.4" data-track-index="12"></audio>
      <audio id="s-p8" class="clip" src="assets/sfx/pop.mp3" data-start="56.2" data-duration="0.72" data-volume="0.5" data-track-index="13"></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // camera: every cut lands on a slightly different scale, so jump cuts read as deliberate
      const cuts = [0, 1.5, 2.8, 4.8, 6.3, 8.3, 10.3, 11.8, 14.2, 15.7, 17.7, 19.2, 21.7, 23.7, 25.7, 27.7, 29.4, 31, 32.5, 34.5, 36.5, 38.5, 40.5, 42.5, 44.5, 46, 48.2, 50.8, 53.8, 55.8];
      const scales = [1.12, 1, 1.1, 1, 1.08, 1, 1.1, 1, 1.08, 1, 1.1, 1, 1.08, 1, 1.1, 1, 1.15, 1, 1.08, 1, 1.1, 1, 1.08, 1, 1.06, 1, 1, 1, 1.08, 1];
      cuts.forEach((t, i) => {
        const end = i + 1 < cuts.length ? cuts[i + 1] : 58.95;
        tl.fromTo("#cam", { scale: scales[i] + 0.04 }, { scale: scales[i], duration: Math.min(0.35, end - t), ease: "power3.out", immediateRender: i === 0 }, t);
      });
      // slow push on the reveal and the turn
      tl.to("#cam", { scale: 1.06, duration: 1.7, ease: "none" }, 46.4);
      tl.to("#cam", { scale: 1.07, duration: 2.6, ease: "none" }, 51.1);

      const slam = (sel, t) =>
        tl.fromTo(sel, { opacity: 0, scale: 1.6, y: -20 }, { opacity: 1, scale: 1, y: 0, duration: 0.32, ease: "back.out(2.4)" }, t);
      const pop = (sel, t) =>
        tl.fromTo(sel, { opacity: 0, scale: 0.6, rotate: -4 }, { opacity: 1, scale: 1, rotate: 0, duration: 0.35, ease: "back.out(2.6)" }, t);
      const out = (sel, t) => tl.to(sel, { opacity: 0, scale: 0.92, duration: 0.18, ease: "power2.in" }, t);

      slam("#t-hook .w1", 0.05);
      slam("#t-hook .w2", 0.3);
      out("#t-hook", 2.55);

      pop("#t-first .chip", 2.9);
      tl.fromTo("#t-first .sub", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 3.15);
      out("#t-first", 4.85);

      pop("#t-smile .chip", 11.9);
      out("#t-smile", 13.95);
      pop("#t-sides .chip", 15.8);
      out("#t-sides", 17.75);
      pop("#t-half .chip", 27.8);
      out("#t-half", 29.15);
      slam("#t-drama .head", 29.45);
      tl.to("#t-drama .head", { rotate: -3, duration: 0.08, yoyo: true, repeat: 5, ease: "none" }, 29.8);
      out("#t-drama", 30.75);
      pop("#t-neck .chip", 36.6);
      out("#t-neck", 38.55);
      pop("#t-check .chip", 44.6);
      out("#t-check", 45.75);

      tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.9, duration: 0.1, ease: "power2.in" }, 45.9);
      tl.to("#flash", { opacity: 0, duration: 0.45, ease: "power2.out" }, 46.0);
      slam("#t-reveal .head", 46.1);
      out("#t-reveal", 47.95);

      pop("#lbl-antes .chip", 48.25);
      pop("#lbl-depois .chip", 48.4);
      tl.to(["#lbl-antes", "#lbl-depois"], { opacity: 0, duration: 0.18 }, 50.55);

      slam("#t-who .head", 51.0);
      out("#t-who", 55.55);

      slam("#t-end .head", 55.9);
      tl.fromTo("#t-end .sub", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 56.2);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
